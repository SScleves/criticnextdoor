<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>critic next door</title>
<style>
  :root{--bg:#121214;--panel:#1b1b1f;--panel2:#222228;--line:#2a2a30;--fg:#e8e6e1;--mute:#8d8a84;--acc:#e5b53d;--neg:#d9534f;--seen:#4caf7d;--want:#5b9cf6;--not:#6b6b73;--radius:8px;--p:#c38bd9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  header h1{font-size:17px;margin:0 8px 0 0;color:var(--acc);letter-spacing:.5px;white-space:nowrap}
  select,input[type=search],input[type=text],button,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  input[type=search]{min-width:180px}
  button{cursor:pointer} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  .modes,.who{display:flex;gap:4px}
  .modes button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  .who button.on{background:var(--fg);color:#111;border-color:var(--fg);font-weight:600}
  .who{border:1px solid var(--line);border-radius:6px;padding:2px} .who button{border:none;padding:4px 10px}
  #filters{display:contents}
  label.chk{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px;cursor:pointer}
  .stats{margin-left:auto;color:var(--mute);font-size:13px}
  .stats b{color:var(--fg)}
  main{padding:14px 16px 60px}
  .count{color:var(--mute);margin-bottom:10px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .count b{color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:transform .08s}
  .card:hover{transform:translateY(-2px);border-color:#44444c}
  .poster{aspect-ratio:2/3;background:#26262c;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--mute);font-size:13px}
  .poster img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{padding:7px 8px}
  .t{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .s{color:var(--mute);font-size:12px;margin-top:2px}
  .d{color:var(--mute);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib{color:#7fb3e6}
  .badge{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;color:#fff;text-transform:uppercase;letter-spacing:.3px;z-index:1}
  .badge.seen{background:var(--seen)} .badge.want{background:var(--want)} .badge.not{background:var(--not)}
  .tier{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:var(--acc);font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;z-index:1;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .others{position:absolute;bottom:6px;left:6px;display:flex;gap:4px;z-index:1}
  .others span{background:rgba(0,0,0,.8);color:var(--p);font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--p);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{display:block;margin:20px auto;padding:10px 24px}
  .center{text-align:center;color:var(--mute);margin:14px 0}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
  a{color:var(--acc)}
  .pool .item{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .pool .item span{color:var(--mute)} .pool .item button{margin-left:auto}
  /* triage */
  .one{max-width:760px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  @media(max-width:640px){.one{grid-template-columns:1fr}}
  .keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px} .keys button{padding:10px 14px}
  .keys button.seen{border-color:var(--seen)} .keys button.want{border-color:var(--want)}
  .meta{color:var(--mute);font-size:13px;margin-bottom:10px}
  .ovw{font-size:14px;color:#c9c6bf;margin-bottom:14px;max-height:120px;overflow:auto}
  /* compare */
  .duel{display:grid;grid-template-columns:minmax(0,320px) auto minmax(0,320px);gap:18px;max-width:900px;margin:0 auto;align-items:center;justify-content:center}
  .vs{color:var(--mute);font-size:22px}
  @media(max-width:640px){.duel{grid-template-columns:1fr} .vs{text-align:center}}
  /* ladder */
  .ladder{max-width:860px;margin:0 auto}
  .rung{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:grab}
  .rung.drag{opacity:.4} .rung.over{border-color:var(--acc)}
  .rung .n{width:28px;color:var(--acc);font-weight:700;text-align:right}
  .rung img{width:36px;height:54px;object-fit:cover;border-radius:4px;background:#26262c}
  .rung .ti{flex:1;min-width:0} .rung .ti b{cursor:pointer} .rung .ti b:hover{color:var(--acc)}
  .rung .wr{color:var(--mute);font-size:12px;white-space:nowrap}
  .rung .mv button{padding:2px 7px;font-size:12px}
  /* progress + tags manager */
  table{border-collapse:collapse;width:100%;max-width:960px;font-size:14px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)} th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num{text-align:right;font-variant-numeric:tabular-nums} th.num{text-align:right}
  tr.link{cursor:pointer} tr.link:hover td{background:var(--panel)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:120px;display:flex}
  .bar i{display:block;height:100%} .bar .b1{background:var(--seen)} .bar .b2{background:var(--acc)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button.on{background:var(--panel2);border-color:#44444c}
  .mgr td input,.mgr td select{padding:3px 6px;font-size:13px}
  .mgr .act{display:flex;gap:6px;flex-wrap:wrap} .mgr .act button{padding:2px 8px;font-size:12px}
  /* the write-up sheet */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:10;overflow:auto;padding:14px}
  .ov.open{display:block}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1360px,100%);margin:0 auto;min-height:calc(100vh - 28px);display:grid;grid-template-rows:1fr auto}
  .cols{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:0}
  .col{padding:18px;min-width:0} .col+.col{border-left:1px solid var(--line)}
  @media(max-width:1000px){.cols{grid-template-columns:200px 1fr} .col.right{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}}
  @media(max-width:640px){.cols{grid-template-columns:1fr} .col+.col{border-left:none;border-top:1px solid var(--line)}}
  .sheet img.p{width:100%;border-radius:8px}
  .sheet h2{margin:0 0 4px;font-size:22px;line-height:1.2}
  .row{margin:12px 0}
  .row label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .row label small{text-transform:none;letter-spacing:0;color:#6f6c66}
  .seg{display:flex;gap:6px} .seg button{flex:1;padding:9px}
  .seg button.on.seen{background:var(--seen);border-color:var(--seen);color:#fff}
  .seg button.on.want{background:var(--want);border-color:var(--want);color:#fff}
  .seg button.on.not{background:var(--not);border-color:var(--not);color:#fff}
  .small{display:flex;gap:8px;flex-wrap:wrap} .small select{flex:1;min-width:0;width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;user-select:none;white-space:nowrap}
  .chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600} .chip.on::before{content:"+ "}
  .chip.neg{background:var(--neg);color:#fff;border-color:var(--neg);font-weight:600} .chip.neg::before{content:"− "}
  .chip.lab{border-color:#4a4a55} .chip.lab.on{background:var(--p);border-color:var(--p);color:#111} .chip.lab.on::before{content:""}
  .chip.sug{border-style:dashed} .chip .c{color:var(--mute);font-size:10px;margin-left:4px} .chip.on .c,.chip.neg .c{color:inherit;opacity:.7}
  .grp{font-size:11px;color:var(--mute);margin:6px 0 2px;width:100%}
  textarea{width:100%;resize:vertical;line-height:1.45;font-size:15px}
  textarea.big{min-height:150px;border-color:#5a4a1e}
  .field{margin-bottom:14px}
  .field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--fg)}
  .field label span{color:var(--mute);font-size:12px;font-weight:400}
  .bottom{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px}
  .hint{color:var(--mute);font-size:12px;margin-right:auto}
  .saved{font-size:12px;color:var(--seen);min-width:70px} .saved.dirty{color:var(--mute)} .saved.err{color:var(--neg)}
  .marks-others{font-size:12px;color:var(--mute);margin-top:8px} .marks-others b{color:var(--p)}
  .dl{position:relative} .dl .menu{display:none;position:absolute;right:0;top:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px;z-index:6;min-width:200px}
  .dl.open .menu{display:block} .dl .menu a{display:block;padding:6px 10px;color:var(--fg);text-decoration:none;font-size:13px;white-space:nowrap} .dl .menu a:hover{background:var(--bg)}
  .lists-bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .lists-bar b{color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>critic next door</h1>
  <div class="who" id="who" title="who is marking"></div>
  <div class="modes">
    <button data-m="browse" title="the grid: click a poster, write it up">browse</button>
    <button data-m="triage" title="one film at a time, keyboard: S W N → ←">triage</button>
    <button data-m="compare" title="which did you like more? ← → ↓">compare</button>
    <button data-m="ladder" title="order the films inside a tier">ladder</button>
    <button data-m="progress" title="where the gaps are">progress</button>
    <button data-m="tags" title="rename, merge and group tags and labels">tags</button>
    <button data-m="foryou" title="unseen films that look like what you tiered high">for you</button>
  </div>
  <div id="filters">
    <input type="search" id="q" placeholder="title or director…">
    <select id="genre"><option value="">all genres</option></select>
    <select id="label"><option value="">all labels</option></select>
    <select id="decade"><option value="0">all decades</option></select>
    <select id="status">
      <option value="">any status</option>
      <option value="unmarked">unmarked</option>
      <option value="seen">seen</option>
      <option value="seen_nonote">seen, no note yet</option>
      <option value="seen_notier">seen, no tier yet</option>
      <option value="want">want to see</option>
      <option value="not">not seen</option>
    </select>
    <select id="tier"><option value="">any tier</option></select>
    <select id="tag"><option value="">any tag</option></select>
    <select id="lst"><option value="">any list</option></select>
    <select id="sort">
      <option value="rating">by IMDb rating</option>
      <option value="rt">by Rotten Tomatoes</option>
      <option value="rank">by list rank</option>
      <option value="tier">by my tier</option>
      <option value="votes">by popularity</option>
      <option value="year">newest first</option>
      <option value="year_asc">oldest first</option>
      <option value="title">A → Z</option>
      <option value="updated">last marked</option>
      <option value="random">shuffle</option>
    </select>
    <label class="chk"><input type="checkbox" id="lib"> in my library</label>
  </div>
  <div class="dl" id="dl"><button>export ▾</button><div class="menu" id="dlmenu"></div></div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="shim.js?v=a34395eb"></script>
<script>
const IMG = "https://image.tmdb.org/t/p/w342";
const MODES = ["browse","triage","compare","ladder","progress","tags","foryou"];
let META, LISTS = [], state = {mode:"browse", offset:0, films:[], total:0, i:0, pair:null, pairs:0, ladderTier:"", progTab:"genre", sameTier:false, pairTier:""};
let current = null, advance = false, saveTimer = null, dirty = false, curator = localStorage.getItem("curator") || "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (url, body, method) => {
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "curator=" + encodeURIComponent(curator), body ? {method: method||"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({curator, ...body})} : method ? {method} : undefined);
  if (!r.ok) { let t = ""; try { t = (await r.json()).detail; } catch {} throw new Error(t || r.statusText); }
  return r.json();
};
const TIMES = {once:"once", few:"a few times", many:"many times"};
const WHEN = {recent:"recently", years:"years ago", kid:"as a kid / teen"};
const MEMORY = {clear:"remember it clearly", fuzzy:"fuzzy memory"};
const curName = id => (META.curators.find(c=>c.id===id)||{name:id}).name;
const otherMarks = f => (f.all_marks||"").split("|").filter(Boolean).map(x=>x.split(":")).filter(([c,s])=>c!==curator && s);

// ---- meta, header -----------------------------------------------------------
async function loadMeta(){
  if (!curator) { const m0 = await (await fetch("/api/meta")).json(); curator = m0.curator; localStorage.setItem("curator", curator); }
  META = await api("/api/meta");
  $("#who").innerHTML = META.curators.map(c=>`<button data-c="${c.id}" class="${c.id===curator?"on":""}">${esc(c.name)}</button>`).join("");
  const keep = id => $("#"+id).value;
  const g = keep("genre"), d = keep("decade"), ti = keep("tier"), ta = keep("tag"), la = keep("label");
  $("#genre").innerHTML = `<option value="">all genres</option>` + META.genres.map(x=>`<option>${x}</option>`).join("");
  $("#label").innerHTML = `<option value="">all labels</option>` + META.labels.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} (${x.n})</option>`).join("");
  $("#decade").innerHTML = `<option value="0">all decades</option>` + META.decades.map(x=>`<option value="${x}">${x}s</option>`).join("");
  $("#tier").innerHTML = `<option value="">any tier</option>` + META.tiers.map(t=>`<option>${t.name}</option>`).join("");
  $("#tag").innerHTML = `<option value="">any tag</option>` + META.tags.filter(t=>t.pos+t.neg).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t.pos+t.neg})</option>`).join("");
  $("#genre").value = g; $("#decade").value = d; $("#tier").value = ti; $("#tag").value = ta; $("#label").value = la;
  const l = $("#lst").value, L = await api("/api/lists"); LISTS = L.lists;
  $("#lst").innerHTML = `<option value="">any list</option>` + LISTS.map(x=>`<option value="${esc(x.list)}">${esc(x.list)} · seen ${x.by[curator]?.seen||0}/${x.total}</option>`).join("");
  $("#lst").value = l;
  const s = META.stats; state.pairs = s.pairs;
  $("#stats").innerHTML = `<b>${s.seen}</b> seen · <b>${s.tiered}</b> tiered · <b>${s.noted}</b> noted · <b>${s.pairs}</b> compared · <b>${s.want}</b> want · ${s.total} total`;
  $("#dlmenu").innerHTML = `<a href="/api/export.csv?curator=${curator}">CSV, ${esc(curName(curator))}'s marks</a><a href="/api/export.csv">CSV, everyone</a>
    <a href="/api/export.md?curator=${curator}" target="_blank">notes.md, ${esc(curName(curator))} (what the AI reads)</a><a href="/api/export.json">JSON, everything</a>`;
}

function params(){
  const p = new URLSearchParams();
  for (const id of ["q","genre","label","decade","status","tier","tag","lst","sort"]) { const v = $("#"+id).value; if (v && v!=="0") p.set(id, v); }
  if ($("#lib").checked) p.set("library", "1");
  p.set("offset", state.offset); p.set("limit", 60);
  return p;
}

async function load(reset=true){
  if (reset) { state.offset = 0; state.films = []; state.i = 0; }
  const r = await api("/api/films?" + params());
  state.total = r.total; state.films = state.films.concat(r.films); state.offset += r.films.length;
  render();
}

// a film marked while the "unmarked" filter is on drops out of the server's list: keep offsets honest
function marked(f){
  const st = $("#status").value;
  const gone = (st === "unmarked" && f.status) || (st === "seen_nonote" && hasNote(f)) || (st === "seen_notier" && f.tier);
  if (!f._marked && gone) { f._marked = true; state.offset = Math.max(0, state.offset - 1); }
}
const hasNote = f => ["about","reached","for_whom","avoid","note"].some(k => (f[k]||"").trim());

// ---- routing: #mode, #film/tt… ---------------------------------------------
function setMode(m, push=true){
  if (!MODES.includes(m)) m = "browse";
  state.mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("#filters").style.display = ["compare","ladder","progress","tags"].includes(m) ? "none" : "";
  if (push && location.hash !== "#"+m) history.replaceState(null, "", "#"+m);
  if (m === "compare") loadPair(); else if (m === "foryou") loadForYou(); else if (m === "ladder") loadLadder();
  else if (m === "progress") loadProgress(); else if (m === "tags") renderTags(); else render();
}
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("film/")) { openFilm(h.slice(5)); return; }
  if (h !== state.mode) setMode(h || "browse", false);
}
window.onhashchange = route;

// ---- cards -------------------------------------------------------------------
const listsLine = f => f.lists ? `<div class="d" title="${esc(f.lists.replace(/\|/g,"  "))}">${esc(f.lists.split("|").map(x=>x.replace("#"," #")).join(" · "))}</div>` : "";

function card(f){
  const poster = f.poster ? `<img loading="lazy" src="${IMG}${f.poster}" alt="">` : `<span>${esc(f.title)}<br><small>${f.year}</small></span>`;
  const badge = f.status ? `<span class="badge ${f.status}">${f.status==="want"?"want":f.status==="not"?"not seen":"seen"}</span>` : "";
  const tier = f.tier ? `<span class="tier" title="${esc(f.tier)}">${esc(f.tier)}</span>` : "";
  const oth = otherMarks(f);
  const others = oth.length ? `<div class="others">${oth.map(([c,s,t])=>`<span title="${esc(curName(c))}: ${s}${t?", "+esc(t):""}">${esc(curName(c)[0])}: ${t ? esc(t) : s}</span>`).join("")}</div>` : "";
  return `<div class="card" data-id="${f.tconst}">${badge}${tier}<div class="poster">${poster}${others}</div>
    <div class="cap"><div class="t">${esc(f.title)}</div>
    <div class="s">${f.year} · ★ ${f.rating}${f.rt!=null?` · 🍅 ${f.rt}`:""} · ${f.runtime||"?"} min${f.in_library?' · <span class="lib" title="in your library">●</span>':''}</div>
    <div class="d">${esc(f.directors||"")}</div>${f.labels?`<div class="d" style="color:var(--p)">${esc(f.labels.replace(/,/g," · "))}</div>`:""}${listsLine(f)}</div></div>`;
}

function render(){
  if (state.mode === "browse") renderGrid();
  else if (state.mode === "triage") renderOne();
  else if (state.mode === "foryou") renderForYou();
  else if (state.mode === "compare") renderPair();
}

function listsBar(){
  const name = $("#lst").value; if (!name) return "";
  const L = LISTS.find(x=>x.list===name); if (!L) return "";
  return `<div class="lists-bar"><b>${esc(name)}</b> · ${L.total} films` + META.curators.map(c => { const b = L.by[c.id]||{};
    return `<span><b>${esc(c.name)}</b>: ${b.seen||0} seen · ${b.tiered||0} tiered · ${b.noted||0} noted · ${b.want||0} want${b.avg_score!=null?` · avg ${b.avg_score}`:""}</span>`; }).join("") +
    `<span style="margin-left:auto;color:var(--mute)">everyone's marks show on the cards</span></div>`;
}

function renderGrid(){
  const q = $("#q").value.trim();
  $("#main").innerHTML = listsBar() + `<div class="count"><span>${state.total} films</span>
      ${q ? `<button id="poolbtn">not here? search all of IMDb for “${esc(q)}”</button>` : ""}</div>
    <div class="pool" id="pool"></div>
    <div class="grid">${state.films.map(card).join("")}</div>
    ${state.offset < state.total ? `<button class="more" id="more">load more</button>` : ""}`;
}

async function poolSearch(){
  const q = $("#q").value.trim(); if (!q) return;

// ---- triage ------------------------------------------------------------------
function renderOne(){
  const f = state.films[state.i], main = $("#main");
  if (!f) {
    if (state.offset < state.total) { main.innerHTML = `<div class="center">loading…</div>`; load(false); return; }
    main.innerHTML = `<div class="center">nothing left with these filters.<br><br>change the filters above, or switch to <b>compare</b>.</div>`; return;
  }
  const poster = f.poster ? `<img src="${IMG}${f.poster}" alt="" style="width:100%;border-radius:8px">` : `<div class="poster"><span>${esc(f.title)}<br><small>${f.year}</small></span></div>`;
  const oth = otherMarks(f);
  main.innerHTML = listsBar() + `<div class="count" style="justify-content:center">${state.i+1} / ${state.total}${f.status ? ` · already marked <b>${f.status}</b>` : ""}${oth.map(([c,s,t])=>` · <span style="color:var(--p)">${esc(curName(c))}: ${s}${t?", "+esc(t):""}</span>`).join("")}</div>
    <div class="one"><div>${poster}</div><div>
      <h2 style="margin:0 0 4px">${esc(f.title)} <span style="color:var(--mute);font-weight:400">(${f.year})</span></h2>
      <div class="meta">${esc(f.directors||"")}<br>${esc(f.genres)} · ${f.runtime||"?"} min · IMDb ★ ${f.rating} (${(f.votes/1000|0)}k)${f.in_library?' · <span class="lib">● in your library</span>':''}</div>
      <div class="ovw">${esc(f.overview||"")}</div>
      <div class="keys">
        <button class="seen" data-k="s"><kbd>S</kbd> seen → write it up</button>
        <button class="want" data-k="w"><kbd>W</kbd> want to see</button>
        <button data-k="n"><kbd>N</kbd> not seen</button>
        <button data-k="skip"><kbd>→</kbd> skip</button>
        <button data-k="back"><kbd>←</kbd> back</button>
      </div></div></div>`;
}

async function triage(k){
  const f = state.films[state.i]; if (!f) return;
  if (k === "back") { state.i = Math.max(0, state.i - 1); renderOne(); return; }
  if (k === "skip") { next(); return; }
  if (k === "s") { openSheet(f, true); return; }
  const status = k === "w" ? "want" : "not";
  const r = await api("/api/mark", {tconst: f.tconst, status, tags: []});
  Object.assign(f, r);
  marked(f); loadMeta(); next();
}

function next(){
  state.i++;
  if (state.i >= state.films.length - 5 && state.offset < state.total) load(false); else renderOne();
}

async function loadPair(){
  const p = new URLSearchParams(); if (state.sameTier) p.set("same_tier", "1"); if (state.pairTier) p.set("tier", state.pairTier);
  state.pair = await api("/api/pair?" + p); renderPair();
}
function renderPair(){
  const p = state.pair, main = $("#main");
  const bar = `<div class="count" style="justify-content:center"><label class="chk"><input type="checkbox" id="sametier" ${state.sameTier?"checked":""}> same tier only</label>
      <select id="pairtier"><option value="">any tier</option>${META.tiers.map(t=>`<option ${t.name===state.pairTier?"selected":""}>${t.name}</option>`).join("")}</select></div>`;
  if (!p || !p.a) { main.innerHTML = bar + `<div class="center">${p ? esc(p.reason) : "…"}</div>`; wirePair(); return; }
  const side = f => `${card(f)}<div class="center" style="margin:6px 0 0;font-size:12px">${f.tier ? esc(f.tier) : "no tier yet"}</div>`;
  main.innerHTML = bar + `<div class="center">which one did ${esc(curName(curator))} like more? <kbd>←</kbd> left · <kbd>→</kbd> right · <kbd>↓</kbd> can't say &nbsp;·&nbsp; <b>${state.pairs}</b> compared</div>
    <div class="duel"><div data-pick="a">${side(p.a)}</div><div class="vs">vs</div><div data-pick="b">${side(p.b)}</div></div>`;
  wirePair();
}
function wirePair(){
  $("#sametier").onchange = e => { state.sameTier = e.target.checked; loadPair(); };
  $("#pairtier").onchange = e => { state.pairTier = e.target.value; loadPair(); };
}
async function pick(which){
  const p = state.pair; if (!p || !p.a) return;
  const r = await api("/api/pair", {a: p.a.tconst, b: p.b.tconst, winner: which === "a" ? p.a.tconst : which === "b" ? p.b.tconst : null});
  state.pairs = r.pairs; loadPair();
}

async function loadLadder(){

  state.ladder = await api("/api/ladder?tier=" + encodeURIComponent(state.ladderTier)); renderLadder();
}
function renderLadder(){
  const L = state.ladder, main = $("#main");
  const tiers = META.tiers.map(t=>`<option ${t.name===state.ladderTier?"selected":""}>${t.name}</option>`).join("");
  main.innerHTML = `<div class="ladder"><div class="count"><select id="ladtier">${tiers}</select><span><b>${L.films.length}</b> films · ${L.films.filter(f=>f.rank).length} ordered</span>
      <span>drag to order, or <kbd>↑</kbd><kbd>↓</kbd> buttons · best at the top · click a title to write it up</span>
      <button id="ladcompare" style="margin-left:auto">compare inside this tier →</button></div>
    <div id="rungs">${L.films.map((f,i)=>rung(f,i)).join("") || `<div class="center">nothing in this tier yet for ${esc(curName(curator))}</div>`}</div></div>`;
  $("#ladtier").onchange = e => { state.ladderTier = e.target.value; loadLadder(); };
  $("#ladcompare").onclick = () => { state.sameTier = true; state.pairTier = state.ladderTier; setMode("compare"); };
  wireDrag();

function rung(f,i){
  const img = f.poster ? `<img src="${IMG}${f.poster}" alt="">` : `<img alt="">`;
  const wr = f.duels ? `${f.wins}/${f.duels} duels won` : "no duels yet";
  return `<div class="rung" draggable="true" data-id="${f.tconst}"><span class="n">${i+1}</span>${img}
    <div class="ti"><b data-open="${f.tconst}">${esc(f.title)}</b> <span style="color:var(--mute)">(${f.year})</span><div class="d">${esc(f.directors||"")}${f.reached?` · <i>${esc(f.reached.slice(0,90))}${f.reached.length>90?"…":""}</i>`:""}</div></div>
    <span class="wr" title="from compare mode">${wr}${f.rank?"":" · unordered"}</span>
    <span class="mv"><button data-mv="-1" title="up">↑</button><button data-mv="1" title="down">↓</button></span></div>`;
}
function wireDrag(){
  const box = $("#rungs"); let dragging = null;
  box.querySelectorAll(".rung").forEach(r => {
    r.ondragstart = e => { dragging = r; r.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; };
    r.ondragend = () => { r.classList.remove("drag"); box.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); };
    r.ondragover = e => { e.preventDefault(); r.classList.add("over"); };
    r.ondragleave = () => r.classList.remove("over");
    r.ondrop = e => { e.preventDefault(); if (!dragging || dragging === r) return;
      const rs = [...box.children]; if (rs.indexOf(dragging) < rs.indexOf(r)) r.after(dragging); else r.before(dragging); saveLadder(); };
  });
  box.onclick = e => {
    const o = e.target.closest("[data-open]"); if (o) { openFilm(o.dataset.open); return; }
    const mv = e.target.closest("[data-mv]"); if (!mv) return;
    const r = mv.closest(".rung"), d = +mv.dataset.mv;
    if (d < 0 && r.previousElementSibling) r.previousElementSibling.before(r);
    if (d > 0 && r.nextElementSibling) r.nextElementSibling.after(r);
    saveLadder();
  };
}
async function saveLadder(){
  const order = [...$("#rungs").querySelectorAll(".rung")].map(r=>r.dataset.id);
  $("#rungs").querySelectorAll(".rung .n").forEach((n,i)=>n.textContent = i+1);
  await api("/api/ladder", {tier: state.ladderTier, order});
  state.ladder.films = order.map((id,i) => Object.assign(state.ladder.films.find(f=>f.tconst===id), {rank:i+1}));
  $("#rungs").querySelectorAll(".wr").forEach(w => w.textContent = w.textContent.replace(" · unordered",""));
}

async function loadProgress(){ state.prog = await api("/api/progress"); renderProgress(); }
function renderProgress(){
  const P = state.prog, main = $("#main"), tab = state.progTab;
  const tabs = [["genre","by genre"],["decade","by decade"],["label","by label"],["list","by list"],["tier","tiers"]];
  let body;
  if (tab === "tier") {
    body = `<table><tr><th>tier</th><th class="num">films</th><th class="num">ordered</th><th></th></tr>` + P.tier.map(r =>
      `<tr class="link" data-ladder="${esc(r.key)}"><td>${esc(r.key)}</td><td class="num">${r.total}</td><td class="num">${r.ranked}</td><td><div class="bar"><i class="b2" style="width:${r.total?100*r.ranked/r.total:0}%"></i></div></td></tr>`).join("") + "</table>";
  } else {
    const rows = P[tab];
    body = `<table><tr><th>${tab}</th><th class="num">films</th><th class="num">seen</th><th class="num">tiered</th><th class="num">noted</th><th class="num">want</th><th class="num">unmarked</th><th>seen · noted</th></tr>` +
      rows.map(r => `<tr class="link" data-f="${tab}" data-key="${esc(r.key)}"><td>${esc(tab==="decade"? r.key+"s" : r.key)}</td><td class="num">${r.total}</td><td class="num">${r.seen}</td><td class="num">${r.tiered}</td><td class="num">${r.noted}</td><td class="num">${r.want}</td><td class="num">${r.unmarked}</td>
        <td><div class="bar"><i class="b2" style="width:${100*r.noted/r.total}%"></i><i class="b1" style="width:${100*(r.seen-r.noted)/r.total}%"></i></div></td></tr>`).join("") + "</table>" +
      (rows.length ? "" : `<div class="center">nothing here yet</div>`);
  }
  main.innerHTML = `<div class="count"><b>${esc(curName(curator))}</b>'s progress · click a row to browse it ·
      <a href="#browse" data-quick="seen_nonote">seen but not noted (${META.stats.seen - META.stats.noted})</a> ·
      <a href="#browse" data-quick="seen_notier">seen but not tiered (${META.stats.seen - META.stats.tiered})</a></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}</div>${body}`;
  main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.progTab = b.dataset.tab; renderProgress(); });
  main.querySelectorAll("[data-quick]").forEach(a => a.onclick = e => { e.preventDefault(); clearFilters(); $("#status").value = a.dataset.quick; setMode("browse"); load(); });
  main.querySelectorAll("tr.link").forEach(tr => tr.onclick = () => {
    if (tr.dataset.ladder) { state.ladderTier = tr.dataset.ladder; setMode("ladder"); return; }
    clearFilters(); const f = tr.dataset.f, k = tr.dataset.key;
    $("#"+({genre:"genre",decade:"decade",label:"label",list:"lst"}[f])).value = k;
    setMode("browse"); load();
  });
}
function clearFilters(){ for (const id of ["q","genre","label","status","tier","tag","lst"]) $("#"+id).value = ""; $("#decade").value = "0"; $("#lib").checked = false; }

// ---- tags & labels manager ---------------------------------------------------
function renderTags(){
  const main = $("#main");
  const groups = kind => [...new Set((kind==="tag"?META.tags:META.labels).map(t=>t.grp))].sort();
  const table = (kind, rows) => `<h3 style="margin:18px 0 8px">${kind==="tag" ? "tags — why it reached you" : "labels — your sub-genres, shared with everyone"} <span style="color:var(--mute);font-weight:400;font-size:13px">${rows.length}</span></h3>
    <div style="margin-bottom:8px"><input type="text" id="new-${kind}" placeholder="new ${kind}, Enter" style="min-width:220px"></div>
    <table class="mgr"><tr><th>name</th><th>group</th>${kind==="tag"?`<th class="num">+</th><th class="num">−</th><th class="num">everyone</th>`:`<th class="num">films</th>`}<th></th></tr>` +
    rows.map(t => `<tr data-kind="${kind}" data-name="${esc(t.name)}"><td class="nm"><span>${esc(t.name)}</span></td>
      <td><input type="text" class="grp-in" value="${esc(t.grp)}" list="grps-${kind}" style="width:120px"></td>
      ${kind==="tag"?`<td class="num">${t.pos}</td><td class="num">${t.neg}</td><td class="num">${t.n}</td>`:`<td class="num">${t.n}</td>`}
      <td class="act"><button data-a="rename">rename</button><button data-a="merge">merge into…</button><button data-a="browse">browse</button>${(kind==="tag"?t.n:t.n)?"":`<button data-a="delete">delete</button>`}</td></tr>`).join("") +
    `</table><datalist id="grps-${kind}">${groups(kind).map(g=>`<option value="${esc(g)}">`).join("")}</datalist>`;
  main.innerHTML = `<div class="count">rename and merge rewrite every film that carries the ${"name"}; counts are ${esc(curName(curator))}'s unless the column says everyone. a tag with no uses can be deleted.</div>` +
    table("tag", META.tags) + table("label", META.labels);
  ["tag","label"].forEach(kind => $("#new-"+kind).onkeydown = async e => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    await api("/api/"+kind, {name: e.target.value}); await loadMeta(); renderTags();
  });
  main.querySelectorAll(".grp-in").forEach(inp => inp.onchange = async () => {
    const tr = inp.closest("tr"); await api(`/api/${tr.dataset.kind}/edit`, {name: tr.dataset.name, grp: inp.value}); await loadMeta();
  });
  main.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr"), kind = tr.dataset.kind, name = tr.dataset.name, act = b.dataset.a, cell = tr.querySelector(".nm");
    if (act === "browse") { clearFilters(); $("#"+(kind==="tag"?"tag":"label")).value = name; setMode("browse"); load(); return; }
    if (act === "delete") { try { await api(`/api/${kind}/${encodeURIComponent(name)}`, null, "DELETE"); } catch (e) { alertInline(cell, e.message); return; } await loadMeta(); renderTags(); return; }
    if (act === "rename") {
      cell.innerHTML = `<input type="text" value="${esc(name)}" style="width:180px"> <button class="primary">ok</button>`;
      const inp = cell.querySelector("input"); inp.focus(); inp.select();
      const go = async () => { const to = inp.value.trim(); if (!to || to === name) { renderTags(); return; }
        try { await api(`/api/${kind}/edit`, {name, to}); } catch (e) { alertInline(cell, e.message); return; } await loadMeta(); renderTags(); };
      cell.querySelector("button").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); if (e.key === "Escape") renderTags(); };
    }
    if (act === "merge") {
      const all = (kind==="tag"?META.tags:META.labels).filter(t=>t.name!==name);
      cell.innerHTML = `${esc(name)} → <select>${all.map(t=>`<option>${esc(t.name)}</option>`).join("")}</select> <button class="primary">merge</button> <button>cancel</button>`;
      const [ok, cancel] = cell.querySelectorAll("button");
      ok.onclick = async () => { await api(`/api/${kind}/edit`, {name, to: cell.querySelector("select").value}); await loadMeta(); renderTags(); };
      cancel.onclick = renderTags;
    }
  });
}
function alertInline(cell, msg){ cell.innerHTML += ` <span style="color:var(--neg);font-size:12px">${esc(msg)}</span>`; }

      </div>
      <div class="seenonly" style="${f.status==="seen"?"":"display:none"}">
        <div class="row"><label>tags <small>· click once: <span style="color:var(--acc)">+ why it worked</span>, twice: <span style="color:var(--neg)">− what went wrong</span>, thrice: off · <kbd>/</kbd> new tag</small></label>
          <div id="sug" class="chips" style="margin-bottom:6px"></div>
          <div class="chips" id="chips">${chips}</div>
          <input type="search" id="newtag" placeholder="new tag, Enter" style="min-width:160px;padding:4px 8px;font-size:12px;margin-top:8px">
        </div>
      </div>
    </div></div>
    <div class="bottom"><span class="hint"><kbd>Esc</kbd> close · <kbd>Ctrl</kbd>+<kbd>←</kbd> <kbd>→</kbd> previous / next film · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> done${advance?" (next in triage)":""}</span>
      <span class="saved" id="saved">saved</span>
      <button id="prev" ${idx>0?"":"disabled"}>← prev</button><button id="next" ${idx>=0&&idx<state.films.length-1?"":"disabled"}>next →</button>
      <button class="primary" id="done">done</button></div>`;
  $("#ov").classList.add("open");
  if (location.hash !== "#film/"+f.tconst) history.replaceState(null, "", "#film/"+f.tconst);
  const sh = $("#sheet");
  sh.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    sh.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); sh.querySelectorAll(".seenonly").forEach(x => x.style.display = b.dataset.s==="seen" ? "" : "none");
    if (b.dataset.s === "seen") $("#m-reached").focus();
    touch();
  });
  $("#chips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; cycle(c); touch(); };
  $("#sug").onclick = e => { const c = e.target.closest(".chip"); if (!c) return;
    const real = $("#chips").querySelector(`[data-tag="${CSS.escape(c.dataset.tag)}"]`);
    if (real) { if (!real.classList.contains("on")) { real.classList.remove("neg"); real.classList.add("on"); } }
    else $("#newtag").insertAdjacentHTML("beforebegin", `<span class="chip on" data-tag="${esc(c.dataset.tag)}">${esc(c.dataset.tag)}</span>`);
    c.remove(); touch(); };
  $("#labelchips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; c.classList.toggle("on"); touch(); };
  $("#newtag").onkeydown = async e => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    e.preventDefault();
    const r = await api("/api/tag", {name: e.target.value});
    if (!META.tags.find(t=>t.name===r.name)) META.tags.push({name:r.name, grp:"custom", pos:0, neg:0, n:0});
    const ex = $("#chips").querySelector(`[data-tag="${CSS.escape(r.name)}"]`);
    if (ex) { ex.classList.remove("neg"); ex.classList.add("on"); }
    else e.target.insertAdjacentHTML("beforebegin", `<span class="chip on" data-tag="${esc(r.name)}">${esc(r.name)}</span>`);
    e.target.value = ""; touch();
  };
  $("#newlabel").onkeydown = e => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    e.preventDefault();
    const name = e.target.value.trim().toLowerCase().split(/\s+/).join("-");
    const ex = $("#labelchips").querySelector(`[data-label="${CSS.escape(name)}"]`);
    if (ex) ex.classList.add("on");
    else $("#labelchips").insertAdjacentHTML("beforeend", `<span class="chip lab on" data-label="${esc(name)}">${esc(name)}</span>`);
    e.target.value = ""; touch();
  };
  sh.querySelectorAll("textarea, select").forEach(el => { el.oninput = touch; el.onchange = touch; });
  $("#done").onclick = done; $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  if (adv && f.status !== "seen") sh.querySelector('[data-s="seen"]').click();
  else if (f.status === "seen") $("#m-reached").focus();
  if (f.status === "seen" || adv) loadSuggestions(f);
}

function cycle(c){
  if (c.classList.contains("on")) { c.classList.remove("on"); c.classList.add("neg"); }
  else if (c.classList.contains("neg")) c.classList.remove("neg");
  else c.classList.add("on");
}

async function loadSuggestions(f){
  const r = await api("/api/suggest?tconst=" + f.tconst);
  if (current !== f) return;
  const have = new Set([...$("#chips").querySelectorAll(".chip.on,.chip.neg")].map(c=>c.dataset.tag));
  const sug = r.tags.filter(t => !have.has(t.name)).slice(0, 8);
  $("#sug").innerHTML = sug.length ? `<div class="grp">suggested, from films like this one</div>` + sug.map(t=>`<span class="chip sug" data-tag="${esc(t.name)}" title="${esc(t.why.join("\n"))}">${esc(t.name)}</span>`).join("") : "";
}

function touch(){
  dirty = true; const s = $("#saved"); s.textContent = "unsaved…"; s.className = "saved dirty";
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 700);
}

function body(){
  const sh = $("#sheet"), f = current;
  const on = sh.querySelector(".seg button.on");
  const status = on ? on.dataset.s : null, seen = status === "seen";
  const v = id => (sh.querySelector("#m-"+id)?.value || "").trim() || null;
  return { tconst: f.tconst, status,
    tier: seen ? v("tier") : null,
    tags: seen ? [...sh.querySelectorAll("#chips .chip.on")].map(c=>c.dataset.tag).concat([...sh.querySelectorAll("#chips .chip.neg")].map(c=>"-"+c.dataset.tag)) : [],
    labels: [...sh.querySelectorAll("#labelchips .chip.on")].map(c=>c.dataset.label),
    about: seen ? v("about") : null, reached: seen ? v("reached") : null, for_whom: seen ? v("for_whom") : null, avoid: seen ? v("avoid") : null,
    note: v("note"), times: seen ? v("times") : null, when_seen: seen ? v("when") : null, memory: seen ? v("memory") : null };
}

async function save(){
  const f = current; if (!f || !dirty) return;
  clearTimeout(saveTimer); dirty = false;
  const s = $("#saved"); s.textContent = "saving…"; s.className = "saved dirty";
  try {
    const r = await api("/api/mark", body());
    Object.assign(f, r);
    if (f.status) marked(f);
    if (current === f) { s.textContent = "saved"; s.className = "saved"; }
    loadMeta();
  } catch (e) { s.textContent = "not saved: " + e.message; s.className = "saved err"; dirty = true; }
}

async function done(){
  if (dirty) await save();
  const adv = advance; closeSheet();
  if (adv && state.mode === "triage") next(); else render();
}

async function step(d){
  if (dirty) await save();
  const i = state.films.indexOf(current) + d;
  if (i < 0) return;
  if (i >= state.films.length) { if (state.offset < state.total) { await load(false); if (i < state.films.length) openSheet(state.films[i], advance); } return; }
  if (state.mode === "triage") state.i = i;
  openSheet(state.films[i], advance);
}

function closeSheet(){
  $("#ov").classList.remove("open"); current = null; dirty = false;
  if (location.hash.startsWith("#film/")) history.replaceState(null, "", "#"+state.mode);
  render();
}

// ---- wiring ------------------------------------------------------------------
$("#main").onclick = e => {
  const pk = e.target.closest("[data-pick]"); if (pk) { pick(pk.dataset.pick); return; }
  const k = e.target.closest("[data-k]"); if (k) { triage(k.dataset.k); return; }
  if (e.target.id === "more") { load(false); return; }
  if (e.target.id === "poolbtn") { poolSearch(); return; }
  const add = e.target.closest("[data-add]"); if (add) { addFilm(add.dataset.add); return; }
  const c = e.target.closest(".card"); if (c) openSheet(state.films.find(f=>f.tconst===c.dataset.id));
};
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("#who").onclick = async e => {
  const b = e.target.closest("[data-c]"); if (!b || b.dataset.c === curator) return;
  if (current) await done();
  curator = b.dataset.c; localStorage.setItem("curator", curator);
  await loadMeta(); state.ladder = null; setMode(state.mode); if (["browse","triage"].includes(state.mode)) load();
};
$("#dl").onclick = e => { if (e.target.tagName === "BUTTON") $("#dl").classList.toggle("open"); else $("#dl").classList.remove("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#dl")) $("#dl").classList.remove("open"); });
$("#ov").onclick = e => { if (e.target.id==="ov") done(); };
document.onkeydown = e => {
  const tag = e.target.tagName, typing = ["INPUT","TEXTAREA","SELECT"].includes(tag);
  if (current) {
    if (e.key === "Escape") { e.preventDefault(); done(); return; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); done(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === "ArrowRight") { e.preventDefault(); step(1); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === "ArrowLeft") { e.preventDefault(); step(-1); return; }
    if (!typing || tag === "SELECT") {
      if (e.key === "/") { e.preventDefault(); $("#newtag")?.focus(); return; }
      const ti = "1234567890-=".indexOf(e.key);
      if (ti >= 0 && META.tiers[ti] && $("#m-tier") && $("#sheet").querySelector(".seg button.on")?.dataset.s === "seen") { e.preventDefault(); $("#m-tier").value = META.tiers[ti].name; touch(); }
    }
    return;
  }
  if (typing) return;
  if (state.mode === "triage") { const k = {s:"s",S:"s",w:"w",W:"w",n:"n",N:"n",ArrowRight:"skip",ArrowLeft:"back"}[e.key]; if (k) { e.preventDefault(); triage(k); } }
  if (state.mode === "compare") { const k = {ArrowLeft:"a",ArrowRight:"b",ArrowDown:"skip"}[e.key]; if (k) { e.preventDefault(); pick(k); } }
};
["genre","label","decade","status","tier","tag","lst","sort","lib"].forEach(id => $("#"+id).onchange = () => state.mode === "foryou" ? loadForYou() : load());
let deb; $("#q").oninput = () => { clearTimeout(deb); deb = setTimeout(()=>load(), 250); };
window.onbeforeunload = () => dirty ? "unsaved" : undefined;

loadMeta().then(() => { const h = location.hash.slice(1); setMode(h.startsWith("film/") ? "browse" : h || "browse", false); return load(); }).then(() => { if (location.hash.startsWith("#film/")) route(); });
</script>
</body>
</html>
