<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>critic next door</title>
<style>
  :root{--bg:#121214;--panel:#1b1b1f;--panel2:#222228;--line:#2a2a30;--fg:#e8e6e1;--mute:#8d8a84;--acc:#e5b53d;--neg:#d9534f;--seen:#4caf7d;--want:#5b9cf6;--not:#6b6b73;--radius:8px;--p:#c38bd9;--who:#e5b53d;--who-soft:#3a3120}
  body[data-curator="paola"]{--who:#c38bd9;--who-soft:#352a3d}
  .c-santi{--who:#e5b53d} .c-paola{--who:#c38bd9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-top:4px solid var(--who);padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  header h1{font-size:17px;margin:0 8px 0 0;color:var(--acc);letter-spacing:.5px;white-space:nowrap}
  select,input[type=search],input[type=text],button,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  input[type=search]{min-width:180px}
  button{cursor:pointer} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  .modes,.who{display:flex;gap:4px}
  .modes button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  .who{gap:6px} .who button{border:2px solid var(--line);padding:5px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;border-radius:8px}
  .who button .q{font-size:11px;font-weight:500;color:var(--mute);background:var(--bg);padding:1px 7px;border-radius:9px}
  .who button.c-santi{border-color:var(--who)} .who button.c-paola{border-color:var(--who)}
  .who button.on{background:var(--who);color:#111} .who button.on .q{background:rgba(0,0,0,.25);color:#111}
  .who button.drop{outline:3px dashed var(--who);outline-offset:2px;transform:scale(1.05)}
  .who-hint{font-size:11px;color:var(--mute);max-width:120px;line-height:1.2}
  #filters{display:contents}
  label.chk{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px;cursor:pointer}
  .stats{margin-left:auto;color:var(--mute);font-size:13px}
  .stats b{color:var(--fg)}
  main{padding:14px 16px 60px}
  .count{color:var(--mute);margin-bottom:10px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .count b{color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:transform .08s}
  .card:hover{transform:translateY(-2px);border-color:#44444c}
  .poster{aspect-ratio:2/3;background:#26262c;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--mute);font-size:13px}
  .poster img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{padding:7px 8px}
  .t{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .s{color:var(--mute);font-size:12px;margin-top:2px}
  .d{color:var(--mute);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib{color:#7fb3e6}
  .badge{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;color:#fff;text-transform:uppercase;letter-spacing:.3px;z-index:1}
  .badge.seen{background:var(--seen)} .badge.want{background:var(--want)} .badge.not{background:var(--not)}
  .tier{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:var(--acc);font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;z-index:1;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .others{position:absolute;bottom:6px;left:6px;display:flex;gap:4px;z-index:1}
  .others span{background:rgba(0,0,0,.8);font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--who);color:var(--who);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qbadge{position:absolute;bottom:6px;right:6px;z-index:1;display:flex;gap:3px} .qbadge span{font-size:10px;background:var(--who);color:#111;padding:1px 6px;border-radius:9px;font-weight:700}
  .card.dragging{opacity:.5}
  .more{display:block;margin:20px auto;padding:10px 24px}
  .center{text-align:center;color:var(--mute);margin:14px 0}
  kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
  a{color:var(--acc)}
  .pool .item{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .pool .item span{color:var(--mute)} .pool .item button{margin-left:auto}
  /* triage */
  .one{max-width:760px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  @media(max-width:640px){.one{grid-template-columns:1fr}}
  .keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px} .keys button{padding:10px 14px}
  .keys button.seen{border-color:var(--seen)} .keys button.want{border-color:var(--want)}
  .meta{color:var(--mute);font-size:13px;margin-bottom:10px}
  .ovw{font-size:14px;color:#c9c6bf;margin-bottom:14px;max-height:120px;overflow:auto}
  /* compare */
  .duel{display:grid;grid-template-columns:minmax(0,320px) auto minmax(0,320px);gap:18px;max-width:900px;margin:0 auto;align-items:center;justify-content:center}
  .vs{color:var(--mute);font-size:22px}
  @media(max-width:640px){.duel{grid-template-columns:1fr} .vs{text-align:center}}
  /* ladder */
  .ladder{max-width:860px;margin:0 auto}
  .rung{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:grab}
  .rung.drag{opacity:.4} .rung.over{border-color:var(--acc)}
  .rung .n{width:28px;color:var(--acc);font-weight:700;text-align:right}
  .rung img{width:36px;height:54px;object-fit:cover;border-radius:4px;background:#26262c}
  .rung .ti{flex:1;min-width:0} .rung .ti b{cursor:pointer} .rung .ti b:hover{color:var(--acc)}
  .rung .wr{color:var(--mute);font-size:12px;white-space:nowrap}
  .rung .mv button{padding:2px 7px;font-size:12px}
  /* progress + tags manager */
  table{border-collapse:collapse;width:100%;max-width:960px;font-size:14px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)} th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num{text-align:right;font-variant-numeric:tabular-nums} th.num{text-align:right}
  tr.link{cursor:pointer} tr.link:hover td{background:var(--panel)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:120px;display:flex}
  .bar i{display:block;height:100%} .bar .b1{background:var(--seen)} .bar .b2{background:var(--acc)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button.on{background:var(--panel2);border-color:#44444c}
  .mgr td input,.mgr td select{padding:3px 6px;font-size:13px}
  .mgr .act{display:flex;gap:6px;flex-wrap:wrap} .mgr .act button{padding:2px 8px;font-size:12px}
  /* the write-up sheet */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:10;overflow:auto;padding:14px}
  .ov.open{display:block}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1360px,100%);margin:0 auto;min-height:calc(100vh - 28px);display:grid;grid-template-rows:1fr auto}
  .cols{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:0}
  .col{padding:18px;min-width:0} .col+.col{border-left:1px solid var(--line)}
  @media(max-width:1000px){.cols{grid-template-columns:200px 1fr} .col.right{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}}
  @media(max-width:640px){.cols{grid-template-columns:1fr} .col+.col{border-left:none;border-top:1px solid var(--line)}}
  .sheet img.p{width:100%;border-radius:8px}
  .sheet h2{margin:0 0 4px;font-size:22px;line-height:1.2}
  .row{margin:12px 0}
  .row label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .row label small{text-transform:none;letter-spacing:0;color:#6f6c66}
  .seg{display:flex;gap:6px} .seg button{flex:1;padding:9px}
  .seg button.on.seen{background:var(--seen);border-color:var(--seen);color:#fff}
  .seg button.on.want{background:var(--want);border-color:var(--want);color:#fff}
  .seg button.on.not{background:var(--not);border-color:var(--not);color:#fff}
  .small{display:flex;gap:8px;flex-wrap:wrap} .small select{flex:1;min-width:0;width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;user-select:none;white-space:nowrap}
  .chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600} .chip.on::before{content:"+ "}
  .chip.neg{background:var(--neg);color:#fff;border-color:var(--neg);font-weight:600} .chip.neg::before{content:"− "}
  .chip.lab{border-color:#4a4a55} .chip.lab.on{background:var(--p);border-color:var(--p);color:#111} .chip.lab.on::before{content:""}
  .chip.lab.auto.on{border-style:dashed;background:#6d4f80;color:#fff}
  .chip.feel{border-color:#4a4a55} .chip.feel.on{background:#3a6b8f;border-color:#3a6b8f;color:#fff;font-weight:600} .chip.feel.on::before{content:""}
  .chip.feel.i1{background:#2b4a60} .chip.feel.i3{background:#5a9ad0;color:#111} .chip.feel .es{color:var(--mute);font-size:10px;margin-left:3px} .chip.feel.on .es{color:inherit;opacity:.8}
  .rate{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
  .rate .top{display:flex;align-items:center;gap:8px} .rate .top button{width:40px;height:40px;border-radius:10px;font-size:20px;flex:none}
  .rate .hero{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
  .rate .hero .n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1} .rate .hero .l{font-size:14px;font-weight:700;line-height:1.2;text-wrap:balance}
  .rate .hero .z{font-size:10px;text-transform:uppercase;letter-spacing:.6px} .rate .hero.none .l{color:var(--mute);font-weight:400}
  .rate input[type=range]{width:100%;margin:0;accent-color:#fff;height:26px;border-radius:8px;background:linear-gradient(90deg,#3b4b5c 0%,#4a5560 23%,#5f6670 45%,#6b6b73 50%,#7a7266 52%,#a98447 66%,#d9913f 80%,#ff7a3d 100%);border:1px solid var(--line);-webkit-appearance:none;appearance:none}
  .rate input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;border-radius:8px;background:#fff;border:3px solid var(--rc,#e5b53d);box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
  .rate input[type=range]::-moz-range-thumb{width:22px;height:30px;border-radius:8px;background:#fff;border:3px solid var(--rc,#e5b53d);cursor:pointer}
  .rate .zones{display:flex;justify-content:space-between;font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .rate .all{align-self:center;font-size:11px;padding:3px 10px;border-radius:12px;color:var(--mute);background:transparent}
  .rate .list{display:flex;flex-direction:column;max-height:260px;overflow:auto;border-top:1px solid var(--line);padding-top:4px}
  .rate .list button{display:flex;gap:10px;align-items:center;text-align:left;padding:5px 8px;border:none;background:transparent;border-radius:6px;color:var(--mute);font-size:12px}
  .rate .list button:hover{background:var(--panel2);color:var(--fg)} .rate .list button.on{background:var(--panel2);color:var(--fg);font-weight:600}
  .rate .list button i{font-style:normal;width:28px;text-align:right;font-variant-numeric:tabular-nums;flex:none} .rate .list button.devil{color:#e5664f}
  .flags{display:flex;gap:6px} .flags button{flex:1;padding:8px 6px;border-radius:10px;font-size:12px;font-weight:600;color:var(--mute)}
  .flags button.on{border-color:var(--acc);background:#2e2a1c;color:var(--fg)}
  .gtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px} .gtags .chip.on{background:#6b5a2a;border-color:#a98447;color:#fff} .gtags .chip.on::before{content:""}
  .badge2{position:absolute;top:30px;left:6px;z-index:1;display:flex;gap:3px} .badge2 span{font-size:11px;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:9px}
  .scale{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .scale button{padding:4px 5px;font-size:12px;font-variant-numeric:tabular-nums;border-radius:6px;line-height:1.2;min-width:0;text-align:left;display:flex;gap:4px;align-items:baseline}
  .scale button small{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .scale button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700} .scale button.on small{color:#111}
  .scale button.neg{border-color:#4a3030} .scale button.neg.on{background:var(--neg);border-color:var(--neg);color:#fff} .scale button.neg.on small{color:#fff}
  .scale-name{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)} .scale-name input{flex:1;padding:3px 6px;font-size:12px;min-width:0}
  .guide{font-size:11px;color:var(--mute);text-align:right;margin-top:2px} .guide.over{color:var(--acc)}
  .reason{display:flex;gap:8px;max-width:620px;margin:14px auto 0;align-items:center} .reason input{flex:1}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px;max-width:960px}
  .sum .box{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--who);border-radius:8px;padding:10px 14px}
  .sum .box h3{margin:0 0 6px;font-size:16px;color:var(--who)} .sum .box .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px} .sum .box .kv b{font-variant-numeric:tabular-nums;text-align:right}
  .by{display:inline-flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums} .by i{font-style:normal;font-size:10px;font-weight:700;color:var(--who)}
  .qbtns{display:flex;gap:6px} .qbtns button{flex:1;border:2px solid var(--who);padding:7px;font-weight:600}
  .qbtns button.on{background:var(--who);color:#111}
  .wrow{display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-radius:10px;border-left:4px solid var(--k);background:var(--kbg)}
  .wrow.lab{--k:var(--p);--kbg:#201c25} .wrow.pos{--k:var(--acc);--kbg:#221f18} .wrow.neg{--k:var(--neg);--kbg:#241a1a}
  .wrow .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px} .wrow .wh b{color:var(--k);font-size:13px} .wrow .wh small{color:var(--mute);font-size:11px;text-align:right}
  .wrow .wc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .wrow .wc input{flex:1;min-width:110px;padding:4px 8px;font-size:12px;border:1px dashed #4a4a55;border-radius:14px;background:var(--bg)}
  .wrow .chip{border-color:var(--k);background:var(--k);color:#111;font-weight:600} .wrow.neg .chip{color:#fff}
  .wrow .chip::before{content:"" !important} .wrow .chip::after{content:" ×";opacity:.55} .wrow .chip:hover::after{opacity:1} .wrow .chip .ang{font-size:9px;opacity:.65;margin-left:4px;font-weight:400}
  .wrow .chip.auto{border-style:dashed;background:#6d4f80;color:#fff}
  .angles{display:flex;flex-wrap:wrap;gap:6px} .angles button{font-size:12px;padding:5px 10px;border-radius:6px;color:var(--mute)} .angles button.on{background:#2e2a1c;border-color:var(--acc);color:var(--fg);font-weight:600}
  .angles button i{font-style:normal;color:var(--acc);margin-left:4px} .angles button i.n{color:var(--neg)}
  .angles button.new{border-style:dashed;background:transparent}
  .apanel{display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
  .apanel .ah{font-size:12px;color:var(--mute);display:flex;justify-content:space-between} .apanel .ah input{width:90px;padding:3px 7px;font-size:11px;border:1px dashed #4a4a55;border-radius:12px;background:var(--bg)}
  .chip.sug{border-style:dashed} .chip .c{color:var(--mute);font-size:10px;margin-left:4px} .chip.on .c,.chip.neg .c{color:inherit;opacity:.7}
  .grp{font-size:11px;color:var(--mute);margin:6px 0 2px;width:100%}
  textarea{width:100%;resize:vertical;line-height:1.45;font-size:15px}
  textarea.big{min-height:150px;border-color:#5a4a1e}
  .field{margin-bottom:14px}
  .field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--fg)}
  .field label span{color:var(--mute);font-size:12px;font-weight:400}
  .bottom{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px}
  .hint{color:var(--mute);font-size:12px;margin-right:auto}
  .saved{font-size:12px;color:var(--seen);min-width:70px} .saved.dirty{color:var(--mute)} .saved.err{color:var(--neg)}
  .marks-others{font-size:12px;color:var(--mute);margin-top:8px} .marks-others b{color:var(--p)}
  .dl{position:relative} .dl .menu{display:none;position:absolute;right:0;top:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px;z-index:6;min-width:200px}
  .dl.open .menu{display:block} .dl .menu a{display:block;padding:6px 10px;color:var(--fg);text-decoration:none;font-size:13px;white-space:nowrap} .dl .menu a:hover{background:var(--bg)}
  .lists-bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .lists-bar b{color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>critic next door</h1>
  <div class="who" id="who" title="who is marking · drag a poster onto a name to put it in that person's to-write queue"></div>
  <div class="modes">
    <button data-m="browse" title="the grid: click a poster, write it up">browse</button>
    <button data-m="triage" title="one film at a time, keyboard: S W N → ←">triage</button>
    <button data-m="compare" title="which did you like more? ← → ↓">compare</button>
    <button data-m="ladder" title="order the films at one score">ladder</button>
    <button data-m="progress" title="where the gaps are">progress</button>
    <button data-m="tags" title="the vocabulary: scale names, end-feelings, tags, labels">words</button>
    <button data-m="foryou" title="unseen films that look like what you tiered high">for you</button>
  </div>
  <div id="filters">
    <input type="search" id="q" placeholder="title or director…">
    <select id="genre"><option value="">all genres</option></select>
    <select id="label"><option value="">all labels</option></select>
    <select id="decade"><option value="0">all decades</option></select>
    <select id="lang"><option value="">any language</option></select>
    <select id="missing" title="what the film still lacks">
      <option value="">missing…</option>
      <option value="score">missing: score</option>
      <option value="feeling">missing: end-feeling</option>
      <option value="reached">missing: why it reached you</option>
      <option value="note">missing: any note</option>
      <option value="tags">missing: tags</option>
      <option value="labels">missing: labels (what it is)</option>
      <option value="writer">missing: who writes it</option>
      <option value="list">not on any list</option>
      <option value="poster">no poster</option>
    </select>
    <select id="status">
      <option value="">any status</option>
      <option value="unmarked">unmarked</option>
      <option value="seen">seen</option>
      <option value="seen_nonote">seen, no note yet</option>
      <option value="seen_notier">seen, no score yet</option>
      <option value="seen_nofeeling">seen, no end-feeling yet</option>
      <option value="want">want to see</option>
      <option value="not">not seen</option>
    </select>
    <select id="score"><option value="">any score</option></select>
    <select id="feeling"><option value="">any end-feeling</option></select>
    <select id="tag"><option value="">any tag</option></select>
    <select id="lst"><option value="">any list</option></select>
    <select id="sort">
      <option value="rating">by rating (weighted by votes)</option>
      <option value="rating_raw">by raw IMDb rating</option>
      <option value="rt">by Rotten Tomatoes</option>
      <option value="rank">by list rank</option>
      <option value="tier">by my score</option>
      <option value="queue">queue order</option>
      <option value="votes">by popularity</option>
      <option value="year">newest first</option>
      <option value="year_asc">oldest first</option>
      <option value="title">A → Z</option>
      <option value="updated">last marked</option>
      <option value="random">shuffle</option>
    </select>
    <label class="chk"><input type="checkbox" id="queue"> my queue</label>
    <label class="chk"><input type="checkbox" id="lib"> in my library</label>
  </div>
  <div class="dl" id="dl"><button>export ▾</button><div class="menu" id="dlmenu"></div></div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="shim.js?v=b291eb01"></script>
<script>
const IMG = "https://image.tmdb.org/t/p/w342";
const MODES = ["browse","triage","compare","ladder","progress","tags","foryou"];
let META, LISTS = [], state = {mode:"browse", offset:0, films:[], total:0, i:0, pair:null, pairs:0, ladderScore:null, progTab:"genre", sameTier:false, pairScore:"", picked:null};
let current = null, advance = false, saveTimer = null, dirty = false, curator = localStorage.getItem("curator") || "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (url, body, method) => {
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "curator=" + encodeURIComponent(curator), body ? {method: method||"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({curator, ...body})} : method ? {method} : undefined);
  if (!r.ok) { let t = ""; try { t = (await r.json()).detail; } catch {} throw new Error(t || r.statusText); }
  return r.json();
};
const TIMES = {once:"once", few:"a few times", many:"many times"};
const WHEN = {recent:"recently", years:"years ago", kid:"as a kid / teen"};
const MEMORY = {clear:"remember it clearly", fuzzy:"fuzzy memory"};
const curName = id => (META.curators.find(c=>c.id===id)||{name:id}).name;
const otherMarks = f => (f.all_marks||"").split("|").filter(Boolean).map(x=>x.split(":")).filter(([c,s])=>c!==curator && s);
const signed = n => (n > 0 ? "+" : "") + n;
const scaleName = sc => { const x = META.scale.find(s=>s.score===+sc); return x && x.name ? x.name : signed(+sc); };   // name if there is one, else the number
const scaleLabel = sc => sc === "" || sc == null ? "" : (scaleName(sc) === signed(+sc) ? signed(+sc) : `${signed(+sc)} ${scaleName(sc)}`);
const ZONE = sc => sc == null ? ["", "#8d8a84"] : sc <= -6 ? ["warn", "#6b8aa8"] : sc <= -1 ? ["don't bother", "#8d9aa8"] : sc === 0 ? ["nothing", "#9a9088"] : sc <= 3 ? ["fine", "#b89b55"] : sc <= 6 ? ["recommend", "#d9913f"] : ["must watch", "#ff7a3d"];
const chipText = f => (f.score != null ? scaleLabel(f.score) : "") + (f.favourite ? " ♥" : "") + (f.guilty ? " 🍿" : "");
const GUIDE = {reached: 400, about: 160, for_whom: 160, avoid: 160, note: 600};   // soft limits: a note, not an essay

// ---- meta, header -----------------------------------------------------------
async function loadMeta(){
  if (!curator) { const m0 = await (await fetch("/api/meta")).json(); curator = m0.curator; localStorage.setItem("curator", curator); }
  META = await api("/api/meta");
  document.body.dataset.curator = curator;
  $("#who").innerHTML = META.curators.map(c=>`<button data-c="${c.id}" class="c-${c.id} ${c.id===curator?"on":""}" title="${esc(c.name)} · ${META.queues[c.id]||0} to write. drop a poster here">${esc(c.name)}<span class="q" title="in the to-write queue">${META.queues[c.id]||0} to write</span></button>`).join("");
  const keep = id => $("#"+id).value;
  const g = keep("genre"), d = keep("decade"), ti = keep("score"), ta = keep("tag"), la = keep("label"), fe = keep("feeling");
  $("#genre").innerHTML = `<option value="">all genres</option>` + META.genres.map(x=>`<option>${x}</option>`).join("");
  $("#label").innerHTML = `<option value="">all labels</option>` + META.labels.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} (${x.n})</option>`).join("");
  $("#decade").innerHTML = `<option value="0">all decades</option>` + META.decades.map(x=>`<option value="${x}">${x}s</option>`).join("");
  const lg = keep("lang"); $("#lang").innerHTML = `<option value="">any language</option>` + (META.languages||[]).map(x=>`<option value="${esc(x.name)}">${esc(x.name)} (${x.n})</option>`).join(""); $("#lang").value = lg;
  $("#score").innerHTML = `<option value="">any score</option>` + META.scale.map(t=>`<option value="${t.score}">${esc(scaleLabel(t.score))}${t.n?` (${t.n})`:""}</option>`).join("");
  $("#feeling").innerHTML = `<option value="">any end-feeling</option>` + META.feelings.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}${t.n?` (${t.n})`:""}</option>`).join("");
  $("#tag").innerHTML = `<option value="">any tag</option>` + META.tags.filter(t=>t.pos+t.neg).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t.pos+t.neg})</option>`).join("");
  $("#genre").value = g; $("#decade").value = d; $("#score").value = ti; $("#tag").value = ta; $("#label").value = la; $("#feeling").value = fe;
  const l = $("#lst").value, L = await api("/api/lists"); LISTS = L.lists;
  $("#lst").innerHTML = `<option value="">any list</option>` + LISTS.map(x=>`<option value="${esc(x.list)}">${esc(x.list)} · seen ${x.by[curator]?.seen||0}/${x.total}</option>`).join("");
  $("#lst").value = l;
  const s = META.stats; state.pairs = s.pairs;
  $("#stats").innerHTML = `<b>${s.seen}</b> seen · <b>${s.tiered}</b> scored · <b>${s.felt}</b> felt · <b>${s.noted}</b> noted · <b>${s.pairs}</b> compared · <b>${s.want}</b> want · ${s.total} total`;
  $("#dlmenu").innerHTML = `<a href="/api/export.csv?curator=${curator}">CSV, ${esc(curName(curator))}'s marks</a><a href="/api/export.csv">CSV, everyone</a>
    <a href="/api/export.md?curator=${curator}" target="_blank">notes.md, ${esc(curName(curator))} (what the AI reads)</a><a href="/api/export.json">JSON, everything</a>`;
}

function params(){
  const p = new URLSearchParams();
  for (const id of ["q","genre","label","decade","lang","missing","status","score","feeling","tag","lst","sort"]) { const v = $("#"+id).value; if (v && v!=="0") p.set(id, v); }
  if ($("#lib").checked) p.set("library", "1");
  if ($("#queue").checked) p.set("queue", "me");
  p.set("offset", state.offset); p.set("limit", 60);
  return p;
}

let loadSeq = 0;
async function load(reset=true){
  if (reset) { state.offset = 0; state.films = []; state.i = 0; }
  const seq = ++loadSeq;
  const r = await api("/api/films?" + params());
  if (seq !== loadSeq) return;   // a newer filter change already answered
  state.total = r.total; state.films = state.films.concat(r.films); state.offset += r.films.length;
  render();
}

// a film marked while the "unmarked" filter is on drops out of the server's list: keep offsets honest
function marked(f){
  const st = $("#status").value;
  const gone = (st === "unmarked" && f.status) || (st === "seen_nonote" && hasNote(f)) || (st === "seen_notier" && f.score != null) || (st === "seen_nofeeling" && f.feelings)
    || ($("#queue").checked && !(f.queued||"").split(",").includes(curator))
    || ({score: f.score != null, feeling: !!f.feelings, reached: !!(f.reached||"").trim(), note: hasNote(f), tags: !!f.tags, labels: !!f.labels, writer: !!f.queued}[$("#missing").value] === true);
  if (!f._marked && gone) { f._marked = true; state.offset = Math.max(0, state.offset - 1); }
}
const hasNote = f => ["about","reached","for_whom","avoid","note"].some(k => (f[k]||"").trim());

// ---- routing: #mode, #film/tt… ---------------------------------------------
function setMode(m, push=true){
  if (!MODES.includes(m)) m = "browse";
  state.mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("#filters").style.display = ["compare","ladder","progress","tags"].includes(m) ? "none" : "";
  if (push && location.hash !== "#"+m) history.replaceState(null, "", "#"+m);
  if (m === "compare") loadPair(); else if (m === "foryou") loadForYou(); else if (m === "ladder") loadLadder();
  else if (m === "progress") loadProgress(); else if (m === "tags") renderTags(); else render();
}
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("film/")) { openFilm(h.slice(5)); return; }
  if (h !== state.mode) setMode(h || "browse", false);
}
window.onhashchange = route;

// ---- cards -------------------------------------------------------------------
const listsLine = f => f.lists ? `<div class="d" title="${esc(f.lists.replace(/\|/g,"  "))}">${esc(f.lists.split("|").map(x=>x.replace("#"," #")).join(" · "))}</div>` : "";

function card(f){
  const poster = f.poster ? `<img loading="lazy" src="${IMG}${f.poster}" alt="">` : `<span>${esc(f.title)}<br><small>${f.year}</small></span>`;
  const badge = f.status ? `<span class="badge ${f.status}">${f.status==="want"?"want":f.status==="not"?"not seen":"seen"}</span>` : "";
  const tier = f.score != null ? `<span class="tier" style="color:${ZONE(f.score)[1]}" title="${esc(scaleLabel(f.score))}">${esc(scaleLabel(f.score))}</span>` : "";
  const flags = (f.favourite || f.guilty) ? `<div class="badge2">${f.favourite?`<span title="one of mine">♥</span>`:""}${f.guilty?`<span title="guilty pleasure: ${esc(f.guilty)}">🍿</span>`:""}</div>` : "";
  const oth = otherMarks(f);
  const others = oth.length ? `<div class="others">${oth.map(([c,s,sc])=>`<span class="c-${c}" title="${esc(curName(c))}: ${s}${sc!==""?", "+esc(scaleLabel(sc)):""}">${esc(curName(c)[0])}: ${sc !== "" ? esc(scaleLabel(sc)) : s}</span>`).join("")}</div>` : "";
  const qs = (f.queued||"").split(",").filter(Boolean);
  const qb = qs.length ? `<div class="qbadge">${qs.map(c=>`<span class="c-${c}" title="${esc(curName(c))} writes this">${esc(curName(c))} ✎</span>`).join("")}</div>` : "";
  return `<div class="card" data-id="${f.tconst}" draggable="true">${badge}${tier}${flags}<div class="poster">${poster}${others}${qb}</div>
    <div class="cap"><div class="t">${esc(f.title)}</div>
    <div class="s">${f.year} · ★ ${f.rating}${f.rt!=null?` · 🍅 ${f.rt}`:""} · ${f.runtime||"?"} min${f.in_library?' · <span class="lib" title="in your library">●</span>':''}</div>
    <div class="d">${esc(f.directors||"")}</div>${f.labels?`<div class="d" style="color:var(--p)">${esc(f.labels.replace(/,/g," · "))}</div>`:""}${listsLine(f)}</div></div>`;
}

function render(){
  if (state.mode === "browse") renderGrid();
  else if (state.mode === "triage") renderOne();
  else if (state.mode === "foryou") renderForYou();
  else if (state.mode === "compare") renderPair();
}

function listsBar(){
  const name = $("#lst").value; if (!name) return "";
  const L = LISTS.find(x=>x.list===name); if (!L) return "";
  return `<div class="lists-bar"><b>${esc(name)}</b> · ${L.total} films` + META.curators.map(c => { const b = L.by[c.id]||{};
    return `<span class="c-${c.id}"><b style="color:var(--who)">${esc(c.name)}</b>: ${b.seen||0} seen · ${b.tiered||0} scored · ${b.noted||0} noted · ${b.want||0} want · ${b.queued||0} to write${b.avg_score!=null?` · avg ${signed(b.avg_score)}`:""}</span>`; }).join("") +
    `<span style="margin-left:auto;color:var(--mute)">everyone's marks show on the cards</span></div>`;
}

function renderGrid(){
  const q = $("#q").value.trim();
  $("#main").innerHTML = listsBar() + `<div class="count"><span>${state.total} films</span>
      ${q ? `<button id="poolbtn">not here? search all of IMDb for “${esc(q)}”</button>` : ""}</div>
    <div class="pool" id="pool"></div>
    <div class="grid">${state.films.map(card).join("")}</div>
    ${state.offset < state.total ? `<button class="more" id="more">load more</button>` : ""}`;
}

async function poolSearch(){
  const q = $("#q").value.trim(); if (!q) return;
  const r = await api("/api/pool?q=" + encodeURIComponent(q));
  $("#pool").innerHTML = r.films.length ? r.films.map(f =>
    `<div class="item"><b>${esc(f.title)}</b> (${f.year}) <span>★ ${f.rating} · ${(f.votes/1000|0)}k votes · ${esc(f.directors||"")}</span>
     <button data-add="${f.tconst}">+ add</button></div>`).join("")
    : `<div class="center">nothing in the IMDb pool either (films with ≥1000 votes)</div>`;
}

async function addFilm(tconst){
  const f = await api("/api/add", {tconst});
  state.films.unshift(f); state.total++;
  render(); openSheet(f);
}

// ---- for you ---------------------------------------------------------------
async function loadForYou(){
  const p = new URLSearchParams(); for (const id of ["lst","genre"]) { const v = $("#"+id).value; if (v) p.set(id, v); }
  state.rec = await api("/api/recommend?" + p); renderForYou();
}
function renderForYou(){
  const r = state.rec, main = $("#main");
  if (!r) { main.innerHTML = `<div class="center">…</div>`; return; }
  if (!r.films.length) { main.innerHTML = `<div class="center">${esc(r.reason||"nothing to show")}</div>`; return; }
  state.films = r.films; state.total = r.films.length; state.offset = r.films.length;
  main.innerHTML = `<div class="count"><span>${r.films.length} unseen films that look like what ${esc(curName(curator))} tiered, based on ${r.based_on} tiered films. director &gt; labels &gt; themes &gt; genre &gt; decade; what you hated counts against.</span></div>
    <div class="grid">${r.films.map(f => `<div>${card(f)}<div class="d" style="margin-top:4px;white-space:normal">${f.score} · ${esc(f.why.join(" · "))}</div></div>`).join("")}</div>`;
}

// ---- triage ------------------------------------------------------------------
function renderOne(){
  const f = state.films[state.i], main = $("#main");
  if (!f) {
    if (state.offset < state.total) { main.innerHTML = `<div class="center">loading…</div>`; load(false); return; }
    main.innerHTML = `<div class="center">nothing left with these filters.<br><br>change the filters above, or switch to <b>compare</b>.</div>`; return;
  }
  const poster = f.poster ? `<img src="${IMG}${f.poster}" alt="" style="width:100%;border-radius:8px">` : `<div class="poster"><span>${esc(f.title)}<br><small>${f.year}</small></span></div>`;
  const oth = otherMarks(f);
  main.innerHTML = listsBar() + `<div class="count" style="justify-content:center">${state.i+1} / ${state.total}${f.status ? ` · already marked <b>${f.status}</b>` : ""}${oth.map(([c,s,sc])=>` · <span class="c-${c}" style="color:var(--who)">${esc(curName(c))}: ${s}${sc!==""?", "+esc(scaleLabel(sc)):""}</span>`).join("")}</div>
    <div class="one"><div>${poster}</div><div>
      <h2 style="margin:0 0 4px">${esc(f.title)} <span style="color:var(--mute);font-weight:400">(${f.year})</span></h2>
      <div class="meta">${esc(f.directors||"")}<br>${esc(f.genres)} · ${f.runtime||"?"} min · IMDb ★ ${f.rating} (${(f.votes/1000|0)}k)${f.in_library?' · <span class="lib">● in your library</span>':''}</div>
      <div class="ovw">${esc(f.overview||"")}</div>
      <div class="keys">
        <button class="seen" data-k="s"><kbd>S</kbd> seen → write it up</button>
        <button class="want" data-k="w"><kbd>W</kbd> want to see</button>
        <button data-k="n"><kbd>N</kbd> not seen</button>
        <button data-k="skip"><kbd>→</kbd> skip</button>
        <button data-k="back"><kbd>←</kbd> back</button>
      </div>
      <div class="keys">${META.curators.map((c,i)=>`<button class="c-${c.id}" data-qk="${c.id}" style="border-color:var(--who)"><kbd>${i+1}</kbd> ${(f.queued||"").split(",").includes(c.id)?"✓":"✎"} ${esc(c.name)} writes it</button>`).join("")}</div></div></div>`;
}

async function triage(k){
  const f = state.films[state.i]; if (!f) return;
  if (k === "back") { state.i = Math.max(0, state.i - 1); renderOne(); return; }
  if (k === "skip") { next(); return; }
  if (k === "s") { openSheet(f, true); return; }
  const status = k === "w" ? "want" : "not";
  const r = await api("/api/mark", {tconst: f.tconst, status, tags: []});
  Object.assign(f, r);
  marked(f); loadMeta(); next();
}

function next(){
  state.i++;
  if (state.i >= state.films.length - 5 && state.offset < state.total) load(false); else renderOne();
}

// ---- compare -----------------------------------------------------------------
async function loadPair(){
  state.picked = null;
  const p = new URLSearchParams(); if (state.sameTier) p.set("same_tier", "1"); if (state.pairScore !== "") p.set("score", state.pairScore);
  state.pair = await api("/api/pair?" + p); renderPair();
}
function renderPair(){
  const p = state.pair, main = $("#main");
  const bar = `<div class="count" style="justify-content:center"><label class="chk"><input type="checkbox" id="sametier" ${state.sameTier?"checked":""}> same score only</label>
      <select id="pairscore"><option value="">any score</option>${META.scale.map(t=>`<option value="${t.score}" ${String(t.score)===String(state.pairScore)?"selected":""}>${esc(scaleLabel(t.score))}</option>`).join("")}</select></div>`;
  if (!p || !p.a) { main.innerHTML = bar + `<div class="center">${p ? esc(p.reason) : "…"}</div>`; wirePair(); return; }
  const side = f => `${card(f)}<div class="center" style="margin:6px 0 0;font-size:12px">${f.score != null ? esc(scaleLabel(f.score)) : "no score yet"}</div>`;
  main.innerHTML = bar + `<div class="center">which one did ${esc(curName(curator))} like more? <kbd>←</kbd> left · <kbd>→</kbd> right · <kbd>↓</kbd> can't say &nbsp;·&nbsp; <b>${state.pairs}</b> compared</div>
    <div class="duel"><div data-pick="a">${side(p.a)}</div><div class="vs">vs</div><div data-pick="b">${side(p.b)}</div></div>
    <div class="reason" id="reason" hidden><span id="reason-for" style="color:var(--mute);font-size:13px;white-space:nowrap"></span><input type="text" id="reason-in" placeholder="because… (one line, in your words; Enter to save, Esc to skip)"><button class="primary" id="reason-ok">save</button><button id="reason-skip">skip</button></div>`;
  wirePair();
}
function wirePair(){
  $("#sametier").onchange = e => { state.sameTier = e.target.checked; loadPair(); };
  $("#pairscore").onchange = e => { state.pairScore = e.target.value; loadPair(); };
  const inp = $("#reason-in"); if (!inp) return;
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendPair(inp.value); } if (e.key === "Escape") { e.preventDefault(); sendPair(""); } };
  $("#reason-ok").onclick = () => sendPair(inp.value); $("#reason-skip").onclick = () => sendPair("");
}
// the winner is chosen first (keyboard), then one line of why; the pair is saved either way
function pick(which){
  const p = state.pair; if (!p || !p.a) return;
  if (which === "skip") { state.picked = null; return sendPair(""); }
  state.picked = which;
  const w = which === "a" ? p.a : p.b, l = which === "a" ? p.b : p.a;
  $("#reason").hidden = false; $("#reason-for").textContent = `${w.title} over ${l.title}, because…`;
  $("#reason-in").focus();
}
async function sendPair(reason){
  const p = state.pair; if (!p || !p.a) return;
  const which = state.picked;
  const r = await api("/api/pair", {a: p.a.tconst, b: p.b.tconst, winner: which === "a" ? p.a.tconst : which === "b" ? p.b.tconst : null, reason: (reason||"").trim() || null});
  state.pairs = r.pairs; loadPair();
}

// ---- ladder: order inside a tier -------------------------------------------
async function loadLadder(){
  if (state.ladderScore == null) { const used = META.scale.find(s=>s.n>0); state.ladderScore = used ? used.score : 10; }
  state.ladder = await api("/api/ladder?score=" + state.ladderScore); renderLadder();
}
function renderLadder(){
  const L = state.ladder, main = $("#main");
  const opts = META.scale.map(t=>`<option value="${t.score}" ${t.score===state.ladderScore?"selected":""}>${esc(scaleLabel(t.score))}${t.n?` (${t.n})`:""}</option>`).join("");
  main.innerHTML = `<div class="ladder"><div class="count"><select id="ladscore">${opts}</select><span><b>${L.films.length}</b> films · ${L.films.filter(f=>f.rank).length} ordered</span>
      <span>drag to order, or <kbd>↑</kbd><kbd>↓</kbd> buttons · best at the top · click a title to write it up</span>
      <button id="ladcompare" style="margin-left:auto">compare at this score →</button></div>
    <div id="rungs">${L.films.map((f,i)=>rung(f,i)).join("") || `<div class="center">nothing at ${esc(scaleLabel(state.ladderScore))} yet for ${esc(curName(curator))}</div>`}</div></div>`;
  $("#ladscore").onchange = e => { state.ladderScore = +e.target.value; loadLadder(); };
  $("#ladcompare").onclick = () => { state.sameTier = true; state.pairScore = String(state.ladderScore); setMode("compare"); };
  wireDrag();
}
function rung(f,i){
  const img = f.poster ? `<img src="${IMG}${f.poster}" alt="">` : `<img alt="">`;
  const wr = f.duels ? `${f.wins}/${f.duels} duels won` : "no duels yet";
  return `<div class="rung" draggable="true" data-id="${f.tconst}"><span class="n">${i+1}</span>${img}
    <div class="ti"><b data-open="${f.tconst}">${esc(f.title)}</b> <span style="color:var(--mute)">(${f.year})</span><div class="d">${esc(f.directors||"")}${f.reached?` · <i>${esc(f.reached.slice(0,90))}${f.reached.length>90?"…":""}</i>`:""}</div></div>
    <span class="wr" title="from compare mode">${wr}${f.rank?"":" · unordered"}</span>
    <span class="mv"><button data-mv="-1" title="up">↑</button><button data-mv="1" title="down">↓</button></span></div>`;
}
function wireDrag(){
  const box = $("#rungs"); let dragging = null;
  box.querySelectorAll(".rung").forEach(r => {
    r.ondragstart = e => { dragging = r; r.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; };
    r.ondragend = () => { r.classList.remove("drag"); box.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); };
    r.ondragover = e => { e.preventDefault(); r.classList.add("over"); };
    r.ondragleave = () => r.classList.remove("over");
    r.ondrop = e => { e.preventDefault(); if (!dragging || dragging === r) return;
      const rs = [...box.children]; if (rs.indexOf(dragging) < rs.indexOf(r)) r.after(dragging); else r.before(dragging); saveLadder(); };
  });
  box.onclick = e => {
    const o = e.target.closest("[data-open]"); if (o) { openFilm(o.dataset.open); return; }
    const mv = e.target.closest("[data-mv]"); if (!mv) return;
    const r = mv.closest(".rung"), d = +mv.dataset.mv;
    if (d < 0 && r.previousElementSibling) r.previousElementSibling.before(r);
    if (d > 0 && r.nextElementSibling) r.nextElementSibling.after(r);
    saveLadder();
  };
}
async function saveLadder(){
  const order = [...$("#rungs").querySelectorAll(".rung")].map(r=>r.dataset.id);
  $("#rungs").querySelectorAll(".rung .n").forEach((n,i)=>n.textContent = i+1);
  await api("/api/ladder", {score: state.ladderScore, order});
  state.ladder.films = order.map((id,i) => Object.assign(state.ladder.films.find(f=>f.tconst===id), {rank:i+1}));
  $("#rungs").querySelectorAll(".wr").forEach(w => w.textContent = w.textContent.replace(" · unordered",""));
}

      <button class="primary" id="done">done</button></div>`;
  $("#ov").classList.add("open");
  if (location.hash !== "#film/"+f.tconst) history.replaceState(null, "", "#film/"+f.tconst);
  const sh = $("#sheet");
  sh.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const wasOn = b.classList.contains("on");   // click the lit one again: no status at all
    sh.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));
    if (!wasOn) b.classList.add("on");
    const seen = !wasOn && b.dataset.s === "seen";
    sh.querySelectorAll(".seenonly").forEach(x => x.style.display = seen ? "" : "none");
    if (seen) $("#m-reached").focus();
    touch();
  });
  // words: tags and labels live in two maps; the column is re-rendered from them
  W = {tags: {}, labels: new Set(labs), auto, angle: null, lgroup: null};
  all.forEach(t => { if (t.startsWith("-")) W.tags[t.slice(1)] = -1; else W.tags[t] = 1; });
  const horror = /Horror|Thriller/.test(f.genres||"");
  W.angle = Object.keys(W.tags).length ? (META.tags.find(t=>W.tags[t.name])||{}).grp : (horror ? "fear" : "theme");
  curScore = f.score != null ? f.score : null; setScore(curScore);
  renderWords();
  $("#qbtns").onclick = async e => { const b = e.target.closest("[data-q]"); if (!b) return;
    const on = !b.classList.contains("on"); await toggleQueue(f, b.dataset.q, on); b.classList.toggle("on", on); };
  $("#m-scale").onclick = e => {
    const st = e.target.closest("[data-step]"); if (st) { const cur = currentScore(); setScore(cur == null ? (+st.dataset.step > 0 ? 6 : 0) : Math.max(-10, Math.min(10, cur + +st.dataset.step))); touch(); return; }
    const pk = e.target.closest("[data-pick]"); if (pk) { setScore(+pk.dataset.pick); touch(); return; }
    if (e.target.id === "r-all") { const l = $("#r-list"); l.hidden = !l.hidden; e.target.textContent = l.hidden ? "see all 21 ▾" : "hide ▴"; if (!l.hidden) l.querySelector(".on")?.scrollIntoView({block:"center"}); }
  };
  $("#r-range").oninput = e => { setScore(+e.target.value); touch(); };
  $("#r-fav").onclick = e => { const b = e.currentTarget; b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); touch(); };
  $("#r-guilty").onclick = e => { const b = e.currentTarget, on = !b.classList.contains("on"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    $("#r-gtags").hidden = !on; if (!on) $("#r-gtags").querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); else if (!$("#r-gtags .chip.on")) $("#r-gtags .chip").classList.add("on"); touch(); };
  $("#r-gtags").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; $("#r-gtags").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on", x===c)); touch(); };
  $("#feelchips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return;
    const i = +c.dataset.i, next = i === 0 ? 2 : i === 2 ? 3 : i === 3 ? 1 : 0;
    if (next && !i && $("#feelchips").querySelectorAll(".chip.on").length >= 2) { flash(c, "two at most: turn one off first"); return; }
    c.dataset.i = next; c.className = "chip feel" + (next ? " on i"+next : "");
    const t = META.feelings.find(x=>x.name===c.dataset.feel) || {};
    c.innerHTML = esc(c.dataset.feel) + (next ? `<span class="c">${next}/3</span>` : t.es ? `<span class="es">${esc(t.es)}</span>` : "");
    touch(); };
  sh.querySelectorAll("textarea[data-guide]").forEach(t => { const g = () => { const n = t.value.trim().length, lim = +t.dataset.guide, el = $("#g-"+t.id.slice(2));
    el.textContent = n ? (n > lim ? `${n} chars · long for a note, is some of this plot?` : `${n} / ~${lim}`) : ""; el.className = "guide" + (n > lim ? " over" : ""); }; t.addEventListener("input", g); g(); });
  sh.querySelectorAll("textarea, select").forEach(el => { el.oninput = touch; el.onchange = touch; });
  $("#done").onclick = done; $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  if (adv && f.status !== "seen") sh.querySelector('[data-s="seen"]').click();
  else if (f.status === "seen") $("#m-reached").focus();
  if (f.status === "seen" || adv) loadSuggestions(f);
}

let curScore = null;
function currentScore(){ return curScore; }
function setScore(sc){
  curScore = sc;
  const h = $("#r-hero"); if (!h) return;
  h.classList.toggle("none", sc == null);
  h.querySelector(".n").textContent = sc != null ? signed(sc) : ""; h.querySelector(".l").textContent = sc != null ? scaleName(sc) : "no score yet"; h.querySelector(".z").textContent = ZONE(sc)[0];
  h.querySelector(".n").style.color = h.querySelector(".z").style.color = ZONE(sc)[1];
  $("#r-range").value = sc != null ? sc : 0; $("#r-range").style.setProperty("--rc", ZONE(sc)[1]);
  $("#r-list").querySelectorAll("[data-pick]").forEach(b => b.classList.toggle("on", sc != null && +b.dataset.pick === sc));
}
function flash(el, msg){ const t = el.title; el.title = msg; el.style.outline = "2px solid var(--neg)"; setTimeout(() => { el.style.outline = ""; el.title = t; }, 1200); }

function cycle(c){
  if (c.classList.contains("on")) { c.classList.remove("on"); c.classList.add("neg"); }
  else if (c.classList.contains("neg")) c.classList.remove("neg");
  else c.classList.add("on");
}

async function loadSuggestions(f){
  const r = await api("/api/suggest?tconst=" + f.tconst);
  if (current !== f) return;
  W.sug = r.tags.map(t => t.name); W.sugWhy = Object.fromEntries(r.tags.map(t => [t.name, t.why.join("\n")]));
  renderSug();
}
function renderSug(){
  const sug = (W.sug||[]).filter(t => !W.tags[t]).slice(0, 8);
  $("#sug").innerHTML = sug.length ? `<div class="grp">suggested, from films like this one · one click</div>` + sug.map(t=>`<span class="chip sug" data-tag="${esc(t)}" title="${esc(W.sugWhy[t]||"")}" style="border-color:var(--acc);color:var(--acc)">${esc(t)}</span>`).join("") : "";
}

// ---- the words column: three rows (what it is / why it reached you / what went wrong) + angles ----
let W = null;
const tagGroup = name => (META.tags.find(t=>t.name===name)||{}).grp || "custom";
function renderWords(){
  if (!W) return;
  const chip = (name, kind, extra="") => `<span class="chip ${extra}" data-w="${kind}" data-name="${esc(name)}" title="click to remove">${esc(name)}${kind!=="lab"?`<span class="ang">${esc(tagGroup(name))}</span>`:""}</span>`;
  $("#w-lab").innerHTML = [...W.labels].map(l => chip(l, "lab", W.auto.has(l) ? "auto" : "")).join("") + `<input type="search" id="add-lab" list="labellist" placeholder="+ add or create…"><datalist id="labellist">${META.labels.map(l=>`<option value="${esc(l.name)}">`).join("")}</datalist>`;
  const pos = Object.keys(W.tags).filter(t=>W.tags[t]>0), neg = Object.keys(W.tags).filter(t=>W.tags[t]<0);
  $("#w-pos").innerHTML = pos.map(t => chip(t, "pos")).join("") + `<input type="search" id="add-pos" list="taglist" placeholder="+ add or create…"><datalist id="taglist">${META.tags.map(t=>`<option value="${esc(t.name)}">`).join("")}</datalist>`;
  $("#w-neg").innerHTML = neg.map(t => chip(t, "neg")).join("") + `<input type="search" id="add-neg" list="taglist" placeholder="+ add or create…">`;
  const groups = [...new Set(META.tags.map(t=>t.grp))];
  $("#angles").innerHTML = groups.map(g => { const n = META.tags.filter(t=>t.grp===g && W.tags[t.name]>0).length, m = META.tags.filter(t=>t.grp===g && W.tags[t.name]<0).length;
    return `<button type="button" data-angle="${esc(g)}" class="${g===W.angle?"on":""}">${esc(g)}${n?`<i>${n}</i>`:""}${m?`<i class="n">${m}</i>`:""}</button>`; }).join("") + `<button type="button" class="new" data-angle="+">+ new angle</button>`;
  const ap = $("#apanel");
  if (W.angle && W.angle !== "+") { ap.hidden = false;
    ap.innerHTML = `<div class="ah"><span>${esc(W.angle)}</span><input type="search" id="add-angle" placeholder="+ new…"></div><div class="chips">` +
      META.tags.filter(t=>t.grp===W.angle).map(t => `<span class="chip ${W.tags[t.name]>0?"on":W.tags[t.name]<0?"neg":""}" data-tag="${esc(t.name)}">${esc(t.name)}${t.pos?`<span class="c">${t.pos}</span>`:""}</span>`).join("") + `</div>`;
  } else if (W.angle === "+") { ap.hidden = false; ap.innerHTML = `<div class="ah"><span>new angle</span></div><div class="chips"><input type="search" id="add-group" placeholder="angle name, Enter (e.g. rhythm)" style="min-width:200px"></div>`; }
  else ap.hidden = true;
  const lg = [...new Set(META.labels.map(l=>l.grp))];
  $("#lgroups").innerHTML = lg.map(g => `<button type="button" data-lgroup="${esc(g)}" class="${g===W.lgroup?"on":""}">${esc(g)}</button>`).join("");
  const lp = $("#lpanel");
  if (W.lgroup) { lp.hidden = false; lp.innerHTML = `<div class="chips">` + META.labels.filter(l=>l.grp===W.lgroup).map(l => `<span class="chip lab ${W.labels.has(l.name)?"on":""}" data-label="${esc(l.name)}">${esc(l.name)}${l.n?`<span class="c">${l.n}</span>`:""}</span>`).join("") + `</div>`; }
  else lp.hidden = true;
  renderSug(); wireWords();
}
function wireWords(){
  const w = $("#words");
  w.onclick = e => {
    const rm = e.target.closest("[data-w]"); if (rm) { if (rm.dataset.w === "lab") W.labels.delete(rm.dataset.name); else delete W.tags[rm.dataset.name]; renderWords(); touch(); return; }
    const a = e.target.closest("[data-angle]"); if (a) { W.angle = W.angle === a.dataset.angle ? null : a.dataset.angle; renderWords(); if (W.angle === "+") $("#add-group")?.focus(); return; }
    const lgb = e.target.closest("[data-lgroup]"); if (lgb) { W.lgroup = W.lgroup === lgb.dataset.lgroup ? null : lgb.dataset.lgroup; renderWords(); return; }
    const c = e.target.closest("#apanel .chip[data-tag], #sug .chip[data-tag]"); if (c) { const t = c.dataset.tag, cur = W.tags[t] || 0;
      if (c.closest("#sug")) W.tags[t] = 1; else if (cur === 0) W.tags[t] = 1; else if (cur > 0) W.tags[t] = -1; else delete W.tags[t];
      renderWords(); touch(); return; }
    const l = e.target.closest("#lpanel .chip[data-label]"); if (l) { const n = l.dataset.label; if (W.labels.has(n)) W.labels.delete(n); else W.labels.add(n); renderWords(); touch(); return; }
  };
  const addWord = async (inp, kind) => {
    const raw = inp.value.trim(); if (!raw) return; inp.value = "";
    if (kind === "lab") { const r = await api("/api/label", {name: raw}); if (!META.labels.find(l=>l.name===r.name)) META.labels.push({name:r.name, grp:"custom", n:0}); W.labels.add(r.name); }
    else { const grp = kind === "angle" ? W.angle : (META.tags.find(t=>t.name===norm(raw))||{}).grp || "custom";
      const r = await api("/api/tag", {name: raw, grp}); if (!META.tags.find(t=>t.name===r.name)) META.tags.push({name:r.name, grp, pos:0, neg:0, n:0});
      W.tags[r.name] = kind === "neg" ? -1 : 1; }
    renderWords(); touch();
  };
  const norm = x => x.trim().toLowerCase().split(/\s+/).join("-");
  for (const [id, kind] of [["add-lab","lab"],["add-pos","pos"],["add-neg","neg"],["add-angle","angle"]]) { const inp = w.querySelector("#"+id); if (inp) inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addWord(inp, kind); } }; }
  const g = w.querySelector("#add-group"); if (g) g.onkeydown = e => { if (e.key === "Enter" && g.value.trim()) { e.preventDefault(); W.angle = g.value.trim().toLowerCase(); META.tags.push({name:"__placeholder__", grp:W.angle, pos:0, neg:0, n:0}); META.tags = META.tags.filter(t=>t.name!=="__placeholder__"); renderWords(); $("#add-angle")?.focus(); } };
}

function touch(){
  dirty = true; const s = $("#saved"); s.textContent = "unsaved…"; s.className = "saved dirty";
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 700);
}

function body(){
  const sh = $("#sheet"), f = current;
  const on = sh.querySelector(".seg button.on");
  const status = on ? on.dataset.s : null, seen = status === "seen";
  const v = id => (sh.querySelector("#m-"+id)?.value || "").trim() || null;
  return { tconst: f.tconst, status,
    score: seen ? currentScore() : null,
    favourite: seen ? $("#r-fav").classList.contains("on") : false,
    guilty: seen && $("#r-guilty").classList.contains("on") ? ($("#r-gtags .chip.on")?.dataset.g || META.guilty_tags[0]) : null,
    feelings: seen ? [...sh.querySelectorAll("#feelchips .chip.on")].map(c=>`${c.dataset.feel}:${c.dataset.i}`) : [],
    tags: seen ? Object.entries(W.tags).map(([t,p]) => (p < 0 ? "-" : "") + t) : [],
    labels: [...W.labels],
    about: seen ? v("about") : null, reached: seen ? v("reached") : null, for_whom: seen ? v("for_whom") : null, avoid: seen ? v("avoid") : null,
    note: v("note"), times: seen ? v("times") : null, when_seen: seen ? v("when") : null, memory: seen ? v("memory") : null };
}

async function save(){
  const f = current; if (!f || !dirty) return;
  clearTimeout(saveTimer); dirty = false;
  const s = $("#saved"); s.textContent = "saving…"; s.className = "saved dirty";
  try {
    const r = await api("/api/mark", body());
    Object.assign(f, r);
    if (f.status) marked(f);
    if (current === f) { s.textContent = "saved"; s.className = "saved"; }
    loadMeta();
  } catch (e) { s.textContent = "not saved: " + e.message; s.className = "saved err"; dirty = true; }
}

async function done(){
  if (dirty) await save();
  const adv = advance; closeSheet();
  if (adv && state.mode === "triage") next(); else render();
}

async function step(d){
  if (dirty) await save();
  const i = state.films.indexOf(current) + d;
  if (i < 0) return;
  if (i >= state.films.length) { if (state.offset < state.total) { await load(false); if (i < state.films.length) openSheet(state.films[i], advance); } return; }
  if (state.mode === "triage") state.i = i;
  openSheet(state.films[i], advance);
}

function closeSheet(){
  $("#ov").classList.remove("open"); current = null; dirty = false;
  if (location.hash.startsWith("#film/")) history.replaceState(null, "", "#"+state.mode);
  render();
}

// ---- wiring ------------------------------------------------------------------
$("#main").onclick = e => {
  const pk = e.target.closest("[data-pick]"); if (pk) { pick(pk.dataset.pick); return; }
  const k = e.target.closest("[data-k]"); if (k) { triage(k.dataset.k); return; }
  const qk = e.target.closest("[data-qk]"); if (qk) { queueFromTriage(qk.dataset.qk); return; }
  if (e.target.id === "more") { load(false); return; }
  if (e.target.id === "poolbtn") { poolSearch(); return; }
  const add = e.target.closest("[data-add]"); if (add) { addFilm(add.dataset.add); return; }
  const c = e.target.closest(".card"); if (c) openSheet(state.films.find(f=>f.tconst===c.dataset.id));
};
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("#who").onclick = async e => {
  const b = e.target.closest("[data-c]"); if (!b || b.dataset.c === curator) return;
  if (current) await done();
  curator = b.dataset.c; localStorage.setItem("curator", curator);
  await loadMeta(); state.ladder = null; setMode(state.mode); if (["browse","triage"].includes(state.mode)) load();
};
$("#dl").onclick = e => { if (e.target.tagName === "BUTTON") $("#dl").classList.toggle("open"); else $("#dl").classList.remove("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#dl")) $("#dl").classList.remove("open"); });
$("#ov").onclick = e => { if (e.target.id==="ov") done(); };
document.onkeydown = e => {
  const tag = e.target.tagName, typing = ["INPUT","TEXTAREA","SELECT"].includes(tag);
  if (current) {
    if (e.key === "Escape") { e.preventDefault(); done(); return; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); done(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === "ArrowRight") { e.preventDefault(); step(1); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === "ArrowLeft") { e.preventDefault(); step(-1); return; }
    if (!typing || tag === "SELECT") {
      if (e.key === "/") { e.preventDefault(); $("#add-pos")?.focus(); return; }
      if ((e.key === "=" || e.key === "+" || e.key === "-") && $("#m-scale") && $("#sheet").querySelector(".seg button.on")?.dataset.s === "seen" ) {
        e.preventDefault(); const cur = currentScore(), d = e.key === "-" ? -1 : 1;
        setScore(cur == null ? (d > 0 ? 6 : 0) : Math.max(-10, Math.min(10, cur + d))); touch(); }
    }
    return;
  }
  if (typing) return;
  if (state.mode === "triage") { const k = {s:"s",S:"s",w:"w",W:"w",n:"n",N:"n",ArrowRight:"skip",ArrowLeft:"back"}[e.key]; if (k) { e.preventDefault(); triage(k); }
    const ci = "123456789".indexOf(e.key); if (ci >= 0 && META.curators[ci]) { e.preventDefault(); queueFromTriage(META.curators[ci].id); } }
  if (state.mode === "compare" && !state.picked) { const k = {ArrowLeft:"a",ArrowRight:"b",ArrowDown:"skip"}[e.key]; if (k) { e.preventDefault(); pick(k); } }
};
["genre","label","decade","lang","missing","status","score","feeling","tag","lst","sort","lib","queue"].forEach(id => $("#"+id).onchange = () => state.mode === "foryou" ? loadForYou() : load());

// ---- who writes it: buttons in the write-up and triage, or drag a poster onto a name ----
async function toggleQueue(f, who, on){
  const r = await api("/api/queue", {curator: who, tconst: f.tconst, on});
  f.queued = r.queued.join(",") || null; META.queues = r.queues;
  $("#who").querySelectorAll("[data-c]").forEach(x => x.querySelector(".q").textContent = `${r.queues[x.dataset.c]||0} to write`);
}
// in triage the key adds the film to that pile and moves on; pressing it on a film already there takes it out
async function queueFromTriage(who){
  const f = state.films[state.i]; if (!f) return;
  const on = !(f.queued||"").split(",").includes(who);
  await toggleQueue(f, who, on);
  if (on) next(); else renderOne();
}

let dragId = null;
$("#main").addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (!c) return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", dragId); });
$("#main").addEventListener("dragend", e => { const c = e.target.closest(".card"); if (c) c.classList.remove("dragging"); dragId = null; $("#who").querySelectorAll(".drop").forEach(b=>b.classList.remove("drop")); });
$("#who").addEventListener("dragover", e => { const b = e.target.closest("[data-c]"); if (!b || !dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; b.classList.add("drop"); });
$("#who").addEventListener("dragleave", e => { const b = e.target.closest("[data-c]"); if (b) b.classList.remove("drop"); });
$("#who").addEventListener("drop", async e => {
  const b = e.target.closest("[data-c]"); const id = dragId || e.dataTransfer.getData("text/plain"); if (!b || !id) return;
  e.preventDefault(); b.classList.remove("drop");
  const f = state.films.find(x=>x.tconst===id);
  const already = f && (f.queued||"").split(",").includes(b.dataset.c);
  const r = await api("/api/queue", {curator: b.dataset.c, tconst: id, on: !already});
  if (f) { f.queued = r.queued.join(",") || null; }
  META.queues = r.queues; $("#who").querySelectorAll("[data-c]").forEach(x => x.querySelector(".q").textContent = `${r.queues[x.dataset.c]||0} to write`);
  if (!$("#queue").checked || b.dataset.c !== curator) render(); else load();
});
let deb; $("#q").oninput = () => { clearTimeout(deb); deb = setTimeout(()=>load(), 250); };
window.onbeforeunload = () => dirty ? "unsaved" : undefined;

loadMeta().then(() => { const h = location.hash.slice(1); setMode(h.startsWith("film/") ? "browse" : h || "browse", false); return load(); }).then(() => { if (location.hash.startsWith("#film/")) route(); });
</script>
